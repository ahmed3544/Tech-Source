name: Activate Push Notifications

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/activate-push-notifications.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wire push registration into App
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')

          if "from './firebase-messaging'" not in s:
              marker = "import { WeeklyShiftSchedule } from './components/WeeklyShiftSchedule';"
              if marker not in s:
                  raise SystemExit('App import marker not found')
              s = s.replace(marker, marker + "\nimport { registerPushNotifications } from './firebase-messaging';", 1)

          if 'registerPushNotifications(currentUser.id)' not in s:
              marker = '  /* =========================================================\n     KEEP REFS UPDATED'
              if marker not in s:
                  raise SystemExit('App effect marker not found')
              effect = "  useEffect(() => {\n    if (!currentUser?.id) return;\n    registerPushNotifications(currentUser.id).catch((error) => {\n      console.warn('[FCM] push registration failed', error);\n    });\n  }, [currentUser?.id]);\n\n\n"
              s = s.replace(marker, effect + marker, 1)

          # Remove accidental duplicate union entries without touching the rest of App.
          needle = "      | 'notifications'\n"
          while s.count(needle) > 1:
              first = s.find(needle)
              second = s.find(needle, first + len(needle))
              s = s[:second] + s[second + len(needle):]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Improve Firebase foreground/native handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/firebase-messaging.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const app = getApps()[0] ?? initializeApp(firebaseConfig);", "const app = getApps()[0] ?? initializeApp(firebaseConfig);\nconst PUSH_API_BASE = 'https://tech-source-git-main-ahmeds-projects-da960d51.vercel.app';")
          s = s.replace("fetch('/api/push/register'", "fetch(`${PUSH_API_BASE}/api/push/register'") if False else s
          s = s.replace("await fetch('/api/push/register',", "await fetch(`${PUSH_API_BASE}/api/push/register`,")
          s = s.replace("if (isNative) {\n    const permission", "if (isNative) {\n    await PushNotifications.removeAllListeners().catch(() => {});\n    const permission")
          s = s.replace("    await PushNotifications.register();\n    return;", "    await PushNotifications.addListener('registrationError', (error) => {\n      console.warn('[FCM] native registration error', error);\n    });\n    await PushNotifications.addListener('pushNotificationReceived', (notification) => {\n      console.info('[FCM] notification received', notification.title);\n    });\n    await PushNotifications.register();\n    return;")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/firebase-messaging.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: activate FCM registration in app'
          git push origin HEAD:main
