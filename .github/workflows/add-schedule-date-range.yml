name: Add Schedule Date Range

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-schedule-date-range.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update weekly schedule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/WeeklyShiftSchedule.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace("  const [weekStart, setWeekStart] = useState(() => startOfSundayWeek(new Date()));", "  const [weekStart, setWeekStart] = useState(() => startOfSundayWeek(new Date()));\n  const [rangeStart, setRangeStart] = useState(() => toDateKey(startOfSundayWeek(new Date())));\n  const [rangeEnd, setRangeEnd] = useState(() => toDateKey(addDays(startOfSundayWeek(new Date()), 6)));")

          old = """  const days = useMemo(() => Array.from({ length: 7 }, (_, index) => {\n    const date = addDays(weekStart, index);\n    return {\n      date,\n      key: toDateKey(date),\n      labelAr: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'][index],\n      labelEn: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][index],\n    };\n  }), [weekStart]);"""
          new = """  const days = useMemo(() => {\n    const start = new Date(`${rangeStart}T00:00:00`);\n    const end = new Date(`${rangeEnd}T00:00:00`);\n    if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) return [];\n    const result: Array<{ date: Date; key: string; labelAr: string; labelEn: string }> = [];\n    for (let cursor = new Date(start); cursor <= end; cursor = addDays(cursor, 1)) {\n      const dayIndex = cursor.getDay();\n      result.push({\n        date: new Date(cursor),\n        key: toDateKey(cursor),\n        labelAr: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'][dayIndex],\n        labelEn: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dayIndex],\n      });\n      if (result.length >= 31) break;\n    }\n    return result;\n  }, [rangeStart, rangeEnd]);"""
          if old not in s:
              raise SystemExit('days block not found')
          s = s.replace(old, new)

          s = s.replace("  const moveWeek = (amount: number) => {\n    setWeekStart(prev => addDays(prev, amount * 7));\n    setDraft({});\n    setSavedAt(null);\n  };", """  const moveWeek = (amount: number) => {\n    const nextStart = addDays(new Date(`${rangeStart}T00:00:00`), amount * 7);\n    const nextEnd = addDays(new Date(`${rangeEnd}T00:00:00`), amount * 7);\n    setWeekStart(nextStart);\n    setRangeStart(toDateKey(nextStart));\n    setRangeEnd(toDateKey(nextEnd));\n    setDraft({});\n    setSavedAt(null);\n  };\n\n  const updateDateRange = (start: string, end: string) => {\n    setRangeStart(start);\n    setRangeEnd(end);\n    setWeekStart(new Date(`${start}T00:00:00`));\n    setDraft({});\n    setSavedAt(null);\n  };""")

          header_old = """<p className=\"text-xs text-slate-400 mt-1\">{days[0].key} → {days[6].key}</p>"""
          header_new = """<p className=\"text-xs text-slate-400 mt-1\">{rangeStart} → {rangeEnd}</p>"""
          s = s.replace(header_old, header_new)

          controls = """          {loading && <div className=\"text-xs text-slate-500\">{lang === 'ar' ? 'جاري تحميل الجدول...' : 'Loading schedule...'}</div>}\n          {isLeader && <label className=\"text-xs font-black text-slate-700 block max-w-xl\"><span className=\"flex items-center gap-1.5 mb-1.5\"><Users className=\"w-3.5 h-3.5\" />{lang === 'ar' ? 'الموظف' : 'Employee'}</span>"""
          replacement = """          {loading && <div className=\"text-xs text-slate-500\">{lang === 'ar' ? 'جاري تحميل الجدول...' : 'Loading schedule...'}</div>}\n          <div className=\"grid grid-cols-1 md:grid-cols-2 gap-3\">\n            <label className=\"text-xs font-black text-slate-700 block\">\n              <span className=\"block mb-1.5\">{lang === 'ar' ? 'من تاريخ' : 'From Date'}</span>\n              <input type=\"date\" value={rangeStart} max={rangeEnd} onChange={e => updateDateRange(e.target.value, rangeEnd)} className=\"w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-bold text-slate-900\" />\n            </label>\n            <label className=\"text-xs font-black text-slate-700 block\">\n              <span className=\"block mb-1.5\">{lang === 'ar' ? 'إلى تاريخ' : 'To Date'}</span>\n              <input type=\"date\" value={rangeEnd} min={rangeStart} onChange={e => updateDateRange(rangeStart, e.target.value)} className=\"w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-bold text-slate-900\" />\n            </label>\n          </div>\n          {isLeader && <label className=\"text-xs font-black text-slate-700 block max-w-xl\"><span className=\"flex items-center gap-1.5 mb-1.5\"><Users className=\"w-3.5 h-3.5\" />{lang === 'ar' ? 'الموظف' : 'Employee'}</span>"""
          if controls not in s:
              raise SystemExit('controls anchor not found')
          s = s.replace(controls, replacement)

          s = s.replace("setWeekStart(startOfSundayWeek(new Date())); setDraft({}); setSavedAt(null);", "setWeekStart(startOfSundayWeek(new Date())); setRangeStart(toDateKey(startOfSundayWeek(new Date()))); setRangeEnd(toDateKey(addDays(startOfSundayWeek(new Date()), 6))); setDraft({}); setSavedAt(null);")

          # Remove the shift name from employee-facing day cards; show only the assigned shift time.
          s = s.replace("<div className=\"text-xs font-black text-slate-800 truncate\">{selectedShift ? (lang === 'ar' ? selectedShift.nameAr : selectedShift.nameEn) : (lang === 'ar' ? 'غير محدد' : 'Not assigned')}</div>", "<div className=\"text-xs font-black text-slate-800 truncate\">{selectedShift ? `${selectedShift.startTime} - ${selectedShift.endTime}` : (lang === 'ar' ? 'غير محدد' : 'Not assigned')}</div>")
          s = s.replace("{lang === 'ar' ? 'حدد الوردية لكل يوم ثم احفظ الجدول.' : 'Select a shift for each day, then save the schedule.'}", "{lang === 'ar' ? 'حدد الشفت لكل تاريخ ثم احفظ الجدول.' : 'Select a shift for each date, then save the schedule.'}")
          s = s.replace("{lang === 'ar' ? 'الجدول الأسبوعي ومواعيد الورديات والاستراحات.' : 'Weekly schedule with shift times and breaks.'}", "{lang === 'ar' ? 'الجدول حسب التاريخ ومواعيد الشفتات والبريك.' : 'Schedule by date with shift times and breaks.'}")

          p.write_text(s, encoding='utf-8')
          PY
      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/WeeklyShiftSchedule.tsx
          git diff --cached --quiet || git commit -m 'Add schedule date range selection'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/add-schedule-date-range.yml
          git add .github/workflows/add-schedule-date-range.yml
          git commit -m 'Remove temporary schedule date workflow'
          git push
