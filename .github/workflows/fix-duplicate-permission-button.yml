name: Remove duplicate permission button

on:
  push:
    branches:
      - fix/remove-duplicate-permission-button

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate button from monthly permissions card
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/EmployeePortal.tsx")
          text = path.read_text(encoding="utf-8")

          start = text.index("          <div className=\"pt-2 border-t border-slate-100\">\n            <button\n              onClick={() => setShowPermissionModal(true)}\n              disabled={monthlySummary.usedPermissionsCount >= 2}")
          end_marker = "          </div>\n        </div>\n\n        {/* CARD 3: TOTAL WORK HOURS & STATS */}"
          end = text.index(end_marker, start)

          replacement = "          </div>\n        </div>\n\n        {/* CARD 3: TOTAL WORK HOURS & STATS */}"
          text = text[:start] + replacement + text[end + len(end_marker):]

          path.write_text(text, encoding="utf-8")

      - name: Verify duplicate button is gone and top button remains
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/components/EmployeePortal.tsx").read_text(encoding="utf-8")
          assert text.count("طلب إذن خروج (ساعتان)") == 1, "Expected exactly one Arabic permission button label"
          assert "CARD 2: MONTHLY PERMISSIONS QUOTA" in text
          assert "CARD 3: TOTAL WORK HOURS & STATS" in text

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EmployeePortal.tsx
          git rm .github/workflows/fix-duplicate-permission-button.yml
          git commit -m "fix: remove duplicate monthly permission button"
          git push