name: Build Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/build-android-app.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure Firebase Android
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_ANDROID_CONFIG_JSON:-}" ]; then
            echo "FIREBASE_ANDROID_CONFIG_JSON is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ['FIREBASE_ANDROID_CONFIG_JSON'].strip()
          if raw.startswith('```'):
              lines = raw.splitlines()
              if lines and lines[0].strip().startswith('```'):
                  lines = lines[1:]
              if lines and lines[-1].strip() == '```':
                  lines = lines[:-1]
              raw = '\n'.join(lines).strip()

          try:
              parsed = json.loads(raw)
              if isinstance(parsed, str):
                  parsed = json.loads(parsed)
          except Exception as exc:
              raise SystemExit(f'FIREBASE_ANDROID_CONFIG_JSON is not valid JSON: {exc}')

          if not isinstance(parsed, dict) or parsed.get('project_info', {}).get('project_id') != 'tech-source-attendance':
              raise SystemExit('FIREBASE_ANDROID_CONFIG_JSON is not the expected tech-source-attendance Firebase config.')

          Path('android/app/google-services.json').write_text(json.dumps(parsed, indent=2) + '\n')
          PY

          python - <<'PY'
          from pathlib import Path

          root = Path('android/build.gradle')
          if root.exists():
              s = root.read_text()
              if 'com.google.gms:google-services:4.5.0' not in s:
                  marker = 'dependencies {'
                  if marker in s:
                      s = s.replace(marker, marker + "\n        classpath 'com.google.gms:google-services:4.5.0'", 1)
                  else:
                      s += "\n\nbuildscript {\n    dependencies {\n        classpath 'com.google.gms:google-services:4.5.0'\n    }\n}\n"
                  root.write_text(s)
          else:
              raise SystemExit('android/build.gradle was not generated')

          app_candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit('Android app Gradle file was not generated')
          s = app.read_text()
          if app.name == 'build.gradle':
              if "apply plugin: 'com.google.gms.google-services'" not in s:
                  s += "\napply plugin: 'com.google.gms.google-services'\n"
          else:
              if 'com.google.gms.google-services' not in s:
                  s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          app.write_text(s)
          PY

      - name: Generate Android app icon from company logo
        run: npx -y @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tech-source-attendance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
