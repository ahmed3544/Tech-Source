name: Build Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'scripts/**'
      - 'firebase/android/google-services.json'
      - '.github/workflows/build-android-app.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -d android
          mkdir -p android/app
          cp firebase/android/google-services.json android/app/google-services.json

      - name: Configure Firebase Android
        run: |
          set -euo pipefail
          test -f firebase/android/google-services.json
          test -f android/app/google-services.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          parsed = json.loads(p.read_text())
          if parsed.get('project_info', {}).get('project_id') != 'tech-source-attendance':
              raise SystemExit('Unexpected Firebase project_id')
          clients = parsed.get('client', [])
          if not any(c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.techsource.attendance' for c in clients):
              raise SystemExit('Expected Android package com.techsource.attendance not found')
          print('Firebase Android config validated.')
          PY

          python - <<'PY'
          from pathlib import Path

          root = Path('android/build.gradle')
          if root.exists():
              s = root.read_text()
              if 'com.google.gms:google-services:4.5.0' not in s:
                  marker = 'dependencies {'
                  if marker in s:
                      s = s.replace(marker, marker + "\n        classpath 'com.google.gms:google-services:4.5.0'", 1)
                  else:
                      s += "\n\nbuildscript {\n    dependencies {\n        classpath 'com.google.gms:google-services:4.5.0'\n    }\n}\n"
                  root.write_text(s)
          else:
              raise SystemExit('android/build.gradle was not generated')

          app_candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit('Android app Gradle file was not generated')
          s = app.read_text()
          if app.name == 'build.gradle':
              if "apply plugin: 'com.google.gms.google-services'" not in s:
                  s += "\napply plugin: 'com.google.gms.google-services'\n"
          else:
              if 'com.google.gms.google-services' not in s:
                  s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          app.write_text(s)
          PY

      - name: Generate Android app icon from company logo
        run: npx -y @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tech-source-attendance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
