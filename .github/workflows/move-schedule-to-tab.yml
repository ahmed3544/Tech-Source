name: Move weekly schedule to navigation tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update navigation and schedule tab
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- App.tsx ----------
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')

          if "import { WeeklyShiftSchedule } from './components/WeeklyShiftSchedule';" not in s:
              anchor = "import { ImportLeavesView } from './components/ImportLeavesView';"
              assert anchor in s, 'App import anchor not found'
              s = s.replace(anchor, anchor + "\nimport { WeeklyShiftSchedule } from './components/WeeklyShiftSchedule';", 1)

          old_type = "      | 'analytics'\n      | 'portal'"
          new_type = "      | 'analytics'\n      | 'schedule'\n      | 'portal'"
          assert old_type in s, 'App activeTab type not found'
          s = s.replace(old_type, new_type, 1)
          assert old_type in s, 'App setActiveTab type not found'
          s = s.replace(old_type, new_type, 1)

          if "activeTab === 'schedule'" not in s:
              portal_marker = re.compile(r"\{activeTab\s*===\s*['\"]portal['\"]\s*&&\s*\(", re.S)
              match = portal_marker.search(s)
              assert match, 'App portal render marker not found'
              block = "{activeTab === 'schedule' && (\n          <WeeklyShiftSchedule\n            lang={lang}\n            onClose={() => setActiveTab(currentUser?.role === 'leader' || !currentUser ? 'dashboard' : 'portal')}\n          />\n        )}\n\n        "
              s = s[:match.start()] + block + s[match.start():]

          # ---------- Header.tsx ----------
          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          old_union = "    | 'analytics'\n    | 'portal';"
          new_union = "    | 'analytics'\n    | 'schedule'\n    | 'portal';"
          assert old_union in s, 'Header activeTab union not found'
          s = s.replace(old_union, new_union, 1)
          old_union2 = "      | 'analytics'\n      | 'portal'\n  ) => void;"
          new_union2 = "      | 'analytics'\n      | 'schedule'\n      | 'portal'\n  ) => void;"
          assert old_union2 in s, 'Header setActiveTab union not found'
          s = s.replace(old_union2, new_union2, 1)
          p.write_text(s, encoding='utf-8')

          # ---------- NotificationCenter.tsx ----------
          p = Path('src/components/NotificationCenter.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import { Bell, CheckCheck, CalendarDays } from 'lucide-react';", "import { Bell, CheckCheck } from 'lucide-react';")
          s = s.replace("import { WeeklyShiftSchedule } from './WeeklyShiftSchedule';\n", "")
          s = s.replace("  const [showSchedule, setShowSchedule] = useState(false);\n", "")
          s = re.sub(r"\n\s*<button\s+type=\"button\"\s+onClick=\{\(\) => \{\s*setShowSchedule\(true\);\s*setIsOpen\(false\);\s*\}\}.*?</button>", "", s, count=1, flags=re.S)
          s = re.sub(r"\n\s*\{showSchedule\s*&&\s*\(\s*<WeeklyShiftSchedule.*?/\>\s*\)\}", "", s, count=1, flags=re.S)
          s = s.replace("  const [showSchedule, setShowSchedule] = useState(false);\n", "")
          p.write_text(s, encoding='utf-8')

          # ---------- Add the schedule tab to the existing Header navigation ----------
          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          if "setActiveTab('schedule')" not in s:
              analytics_pattern = re.compile(r"(<button\s+onClick=\{\(\) => setActiveTab\('analytics'\)\}.*?</button>)", re.S)
              match = analytics_pattern.search(s)
              assert match, 'Header analytics navigation button not found'
              schedule_button = '''\n              <button\n                onClick={() => setActiveTab('schedule')}\n                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${\n                  activeTab === 'schedule'\n                    ? 'bg-[#0d2240] text-white font-bold border border-blue-900 shadow-md'\n                    : 'text-slate-400 hover:text-white hover:bg-slate-800'\n                }`}\n              >\n                <CalendarCheck className="w-4 h-4 text-emerald-400" />\n                <span>\n                  {lang === 'ar' ? 'الجدول' : 'Schedule'}\n                </span>\n              </button>'''
              s = s[:match.end()] + schedule_button + s[match.end():]
          p.write_text(s, encoding='utf-8')
          PY

      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Header.tsx src/components/NotificationCenter.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Move weekly schedule into navigation tab"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/move-schedule-to-tab.yml || true
          git commit -m "Remove temporary schedule migration workflow" || true
          git push || true
