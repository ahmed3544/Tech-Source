name: Fix Employee List Card Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply employee card layout fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/KioskPunch.tsx')
          text = path.read_text(encoding='utf-8')

          old_outer = '''className={`p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${'''
          new_outer = '''className={`p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between gap-2 min-w-0 ${'''
          if old_outer in text:
              text = text.replace(old_outer, new_outer, 1)

          old_inner = '''<div className="flex items-center gap-3">\n                      <UserAvatar name={emp.nameEn || emp.nameAr} code={emp.code} size="md" />\n                      <div className="min-w-0">'''
          new_inner = '''<div className="flex items-center gap-2 min-w-0 flex-1">\n                      <UserAvatar name={emp.nameEn || emp.nameAr} code={emp.code} size="md" />\n                      <div className="min-w-0 flex-1">'''
          if old_inner in text:
              text = text.replace(old_inner, new_inner, 1)

          old_name_row = '''<div className="flex items-center gap-2 flex-nowrap min-w-0">'''
          new_name_row = '''<div className="flex items-center gap-2 min-w-0 flex-wrap sm:flex-nowrap">'''
          if old_name_row in text:
              text = text.replace(old_name_row, new_name_row, 1)

          old_dept = '''<p className="text-xs text-slate-500">'''
          new_dept = '''<p className="text-xs text-slate-500 font-bold truncate">'''
          if old_dept in text:
              text = text.replace(old_dept, new_dept, 1)

          old_badges = '''<div className="flex flex-col items-end gap-1">'''
          new_badges = '''<div className="flex items-center justify-start gap-1 shrink-0 min-w-0">'''
          if old_badges in text:
              text = text.replace(old_badges, new_badges, 1)

          text = re.sub(
              r'(className="inline-flex items-center gap-1 text-\[10px\] font-bold )',
              r'\1whitespace-nowrap shrink-0 px-1.5 sm:px-2 ',
              text,
              count=1,
          )
          replacements = {
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-full border border-amber-300 animate-pulse"':
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-amber-800 bg-amber-100 px-1.5 sm:px-2 py-0.5 rounded-full border border-amber-300 animate-pulse whitespace-nowrap shrink-0"',
              'className="inline-flex items-center gap-1.5 text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full border border-emerald-300"':
              'className="inline-flex items-center gap-1.5 text-[10px] font-bold text-emerald-800 bg-emerald-100 px-1.5 sm:px-2 py-0.5 rounded-full border border-emerald-300 whitespace-nowrap shrink-0"',
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-slate-600 bg-slate-200 px-2 py-0.5 rounded-full"':
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-slate-600 bg-slate-200 px-1.5 sm:px-2 py-0.5 rounded-full whitespace-nowrap shrink-0"',
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded-full border border-sky-200"':
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-sky-700 bg-sky-50 px-1.5 sm:px-2 py-0.5 rounded-full border border-sky-200 whitespace-nowrap shrink-0"',
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200"':
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-amber-700 bg-amber-50 px-1.5 sm:px-2 py-0.5 rounded-full border border-amber-200 whitespace-nowrap shrink-0"',
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-200"':
              'className="inline-flex items-center gap-1 text-[10px] font-bold text-rose-700 bg-rose-50 px-1.5 sm:px-2 py-0.5 rounded-full border border-rose-200 whitespace-nowrap shrink-0"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Full production build verification
        run: npm run build

      - name: Verify employee card classes
        shell: bash
        run: |
          grep -F 'flex items-center justify-between gap-2 min-w-0' src/components/KioskPunch.tsx
          grep -F 'flex items-center gap-2 min-w-0 flex-1' src/components/KioskPunch.tsx
          grep -F 'whitespace-nowrap shrink-0' src/components/KioskPunch.tsx

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/KioskPunch.tsx
          if git diff --cached --quiet; then
            echo 'No employee card changes to commit.'
            exit 0
          fi
          git commit -m 'fix: prevent employee status badge overlap'
          git pull --rebase origin main
          git push origin HEAD:main
