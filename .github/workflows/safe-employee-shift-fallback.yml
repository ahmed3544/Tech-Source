name: Safe employee shift fallback

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch unsafe shift rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/EmployeeManager.tsx')
          s = p.read_text(encoding='utf-8')
          old = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0];"
          new = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0] || { startTime: '09:00', endTime: '17:00', nameAr: 'الوردية الصباحية', nameEn: 'Morning Shift' };"
          if old not in s:
              raise SystemExit('Expected EmployeeManager shift expression was not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/EmployeeManager.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix employee screen crash when shifts are unavailable'
          git push
