name: Safe attendance and shift rules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              out = fn(s)
              if out != s:
                  p.write_text(out, encoding='utf-8')
                  print(f'Patched: {path}')
              else:
                  print(f'No change: {path}')

          def employee_manager(s):
              old = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0];"
              new = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0] || { startTime: '09:00', endTime: '17:00', nameAr: 'الدوام الموحد', nameEn: 'Standard Shift' };"
              return s.replace(old, new)

          def employee_portal(s):
              old = "return shifts.find(shift => shift.id === (assignment?.shiftId || emp?.shiftId)) || shifts[0];"
              new = "return shifts.find(shift => shift.id === (assignment?.shiftId || emp?.shiftId)) || shifts[0] || { id: 'fallback-shift', nameAr: 'الدوام الموحد', nameEn: 'Standard Shift', startTime: '09:00', endTime: '17:00', gracePeriodMinutes: 0, workDays: [0, 1, 2, 3, 4], breaks: [] };"
              return s.replace(old, new)

          def shift_manager(s):
              s = s.replace(
                  "if (!formData.nameAr || !formData.nameEn || !formData.startTime || !formData.endTime) {\n      alert(lang === 'ar' ? 'الرجاء ملء اسم الشفت ووقت البداية والنهاية' : 'Please fill the shift name, start time and end time');",
                  "if (!formData.startTime || !formData.endTime) {\n      alert(lang === 'ar' ? 'الرجاء تحديد وقت بداية ونهاية الشفت' : 'Please select the shift start and end time');"
              )
              s = s.replace(
                  "nameAr: formData.nameAr,\n      nameEn: formData.nameEn,",
                  "nameAr: `${formData.startTime} - ${formData.endTime}`,\n      nameEn: `${formData.startTime} - ${formData.endTime}`,"
              )
              # Remove only the two shift-name inputs; all other scheduling controls stay intact.
              s = re.sub(
                  r"\s*<div className=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\s*<label[^>]*>\{lang === 'ar' \? 'اسم الشفت \(عربي\)'[^<]*<input[^>]*\/>\s*</label>\s*<label[^>]*>\{lang === 'ar' \? 'اسم الشفت \(إنجليزي\)'[^<]*<input[^>]*\/>\s*</label>\s*</div>",
                  "",
                  s,
                  count=1
              )
              return s

          def helpers(s):
              # evaluatePunch must not create overtime from clock times.
              s = re.sub(r"overtimeHours:\s*overtimeHours,", "overtimeHours: 0,", s, count=1)
              return s

          patch('src/components/EmployeeManager.tsx', employee_manager)
          patch('src/components/EmployeePortal.tsx', employee_portal)
          patch('src/components/ShiftManager.tsx', shift_manager)
          patch('src/utils/helpers.ts', helpers)

          def css(s):
              if '--tech-source-navy' in s:
                  return s
              return """:root {\n  --tech-source-navy: #0d2240;\n  --tech-source-blue: #1769aa;\n  --tech-source-teal: #0f766e;\n  --tech-source-surface: #f5f8fc;\n}\nhtml, body, #root { min-height: 100%; }\nbody { background: var(--tech-source-surface); }\n::selection { background: rgba(23, 105, 170, 0.18); }\n\n""" + s

          patch('src/index.css', css)
          PY

      - name: Basic source verification
        shell: bash
        run: |
          test -f src/components/EmployeeManager.tsx
          test -f src/components/EmployeePortal.tsx
          test -f src/components/ShiftManager.tsx
          test -f src/utils/helpers.ts
          grep -q "fallback-shift" src/components/EmployeePortal.tsx
          grep -q "const shift = shifts.find" src/components/EmployeeManager.tsx

      - name: Commit patches
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/EmployeeManager.tsx src/components/EmployeePortal.tsx src/components/ShiftManager.tsx src/utils/helpers.ts src/index.css
          git diff --cached --quiet && exit 0
          git commit -m 'Apply safe shift scheduling and overtime approval rules'
          git push
