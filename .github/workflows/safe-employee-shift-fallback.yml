name: Safe attendance and shift rules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply guarded patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              out = fn(s)
              if out != s:
                  p.write_text(out, encoding='utf-8')
                  print(f'Patched: {path}')
              else:
                  print(f'No change: {path}')

          def employee_manager(s):
              old = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0];"
              new = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0] || { startTime: '09:00', endTime: '17:00', nameAr: 'الدوام الموحد', nameEn: 'Standard Shift' };"
              return s.replace(old, new)

          def employee_portal(s):
              old = "return shifts.find(shift => shift.id === (assignment?.shiftId || emp?.shiftId)) || shifts[0];"
              new = "return shifts.find(shift => shift.id === assignment?.shiftId) || { id: 'fallback-shift', nameAr: 'غير محدد', nameEn: 'Unassigned', startTime: '09:00', endTime: '17:00', durationMinutes: 480, gracePeriodMinutes: 0, workDays: [0, 1, 2, 3, 4], breaks: [] };"
              return s.replace(old, new)

          def app(s):
              old = "s.id === (dailyAssignment?.shiftId || emp.shiftId)"
              new = "s.id === dailyAssignment?.shiftId"
              return s.replace(old, new)

          def shift_manager(s):
              s = s.replace(
                  "if (!formData.nameAr || !formData.nameEn || !formData.startTime || !formData.endTime) {\n      alert(lang === 'ar' ? 'الرجاء ملء اسم الشفت ووقت البداية والنهاية' : 'Please fill the shift name, start time and end time');",
                  "if (!formData.startTime || !formData.endTime) {\n      alert(lang === 'ar' ? 'الرجاء تحديد وقت بداية ونهاية الشفت' : 'Please select the shift start and end time');"
              )
              s = s.replace(
                  "nameAr: formData.nameAr,\n      nameEn: formData.nameEn,",
                  "nameAr: `${formData.startTime} - ${formData.endTime}`,\n      nameEn: `${formData.startTime} - ${formData.endTime}`,"
              )
              return s

          def helpers(s):
              return re.sub(r"overtimeHours:\s*overtimeHours,", "overtimeHours: 0,", s, count=1)

          def server(s):
              needle = "calculated.updatedAt = new Date().toISOString();"
              if "const approvedOvertimeForPunch" in s:
                  return s
              insert = needle + "\n\n      const approvedOvertimeForPunch = (localState.overtimeRequests || []).some((request: any) => String(request.employeeId) === String(employeeId) && String(request.date) === String(newRecord.date) && String(request.status).toLowerCase() === 'approved');\n      if (!approvedOvertimeForPunch) calculated.overtimeHours = 0;"
              if needle not in s:
                  return s
              return s.replace(needle, insert, 1)

          def header(s):
              s = s.replace(
                  '<header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">',
                  '<header dir={lang === \'ar\' ? \'rtl\' : \'ltr\'} className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">',
                  1
              )
              s = s.replace(
                  '<nav className="bg-slate-950/80 border-t border-slate-800/80 px-4 sm:px-6">',
                  '<nav dir={lang === \'ar\' ? \'rtl\' : \'ltr\'} className="bg-slate-950/80 border-t border-slate-800/80 px-4 sm:px-6">',
                  1
              )
              s = s.replace(
                  'className="max-w-7xl mx-auto flex items-center gap-1.5 overflow-x-auto py-1.5 scrollbar-none"',
                  'className="max-w-7xl mx-auto flex items-center gap-3 overflow-x-auto py-1.5 scrollbar-none"',
                  1
              )
              return s

          def css(s):
              marker = '/* Header/Navbar tabs: deterministic RTL/LTR direction'
              if marker in s:
                  return s
              return s + r'''

/* Header/Navbar tabs: deterministic RTL/LTR direction, clean Arabic typography, and safe horizontal scrolling. */
#root header nav {
  direction: rtl;
  font-family: 'Cairo', Inter, ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 0;
}

#root header nav > div {
  display: flex;
  align-items: center;
  gap: 12px !important;
  min-width: 0;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  flex-wrap: nowrap;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}

#root header nav > div::-webkit-scrollbar { display: none; }

#root header nav button {
  flex: 0 0 auto !important;
  white-space: nowrap !important;
  min-width: max-content;
  max-width: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: 'Cairo', Inter, ui-sans-serif, system-ui, sans-serif;
  font-weight: 700 !important;
  letter-spacing: 0 !important;
  word-spacing: normal;
  direction: inherit;
}

#root header nav button span {
  white-space: nowrap !important;
  letter-spacing: 0 !important;
  font-weight: 700 !important;
}

@media (max-width: 767px) {
  #root header nav { padding-left: 8px; padding-right: 8px; }
  #root header nav > div { gap: 12px !important; padding-top: 4px; padding-bottom: 4px; }
  #root header nav button { font-size: 0.75rem !important; line-height: 1.25 !important; padding-left: 10px; padding-right: 10px; }
}

@media (max-width: 390px) {
  #root header nav button { font-size: 0.71rem !important; padding-left: 9px; padding-right: 9px; }
}
'''

          patch('src/components/EmployeeManager.tsx', employee_manager)
          patch('src/components/EmployeePortal.tsx', employee_portal)
          patch('src/App.tsx', app)
          patch('src/components/ShiftManager.tsx', shift_manager)
          patch('src/utils/helpers.ts', helpers)
          patch('server.ts', server)
          patch('src/components/Header.tsx', header)
          patch('src/index.css', css)
          PY

      - name: Commit patches
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/EmployeeManager.tsx src/components/EmployeePortal.tsx src/components/ShiftManager.tsx src/utils/helpers.ts src/components/Header.tsx src/index.css server.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix navbar RTL layout and mobile tab scrolling'
          git push
