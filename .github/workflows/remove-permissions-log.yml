name: Remove Employee Permissions Log

on:
  push:
    branches: [main]

jobs:
  remove-permissions-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove permissions log tab
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/EmployeePortal.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              "useState<'attendance' | 'penalties' | 'permissions'>('attendance')",
              "useState<'attendance' | 'penalties'>('attendance')"
          )

          pattern = re.compile(
              r"\n\s*<button\n\s*onClick=\{\(\) => setActiveDashboardTab\('permissions'\)\}\n.*?\n\s*</button>",
              re.S,
          )
          text, removed = pattern.subn('', text, count=1)

          if removed == 0:
              pattern2 = re.compile(
                  r"\n\s*<button[^>]*setActiveDashboardTab\('permissions'\)[^>]*>.*?3\. سجل الأذونات والإجازات الإدارية.*?</button>",
                  re.S,
              )
              text, removed = pattern2.subn('', text, count=1)

          if text == original:
              print('No source change required; permissions log already removed.')
          else:
              path.write_text(text, encoding='utf-8')
              print(f'Removed permissions log tab: {removed}')

      - name: Build and verify
        run: |
          npm install
          npm run build
          if grep -q "3\. سجل الأذونات والإجازات الإدارية" src/components/EmployeePortal.tsx; then
            echo "Permissions log label still exists"
            exit 1
          fi
          if grep -q "setActiveDashboardTab('permissions')" src/components/EmployeePortal.tsx; then
            echo "Permissions dashboard tab handler still exists"
            exit 1
          fi
          grep -q "NotificationCenter" src/components/Header.tsx
          echo "Permissions log removal and notification center verification passed"

      - name: Commit and push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EmployeePortal.tsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix: remove permissions and leave history tab"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
