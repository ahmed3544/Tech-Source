name: Patch schedule sync headers
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_schedule_headers.py
      - run: |
          rm scripts/patch_schedule_headers.py
          rm .github/workflows/patch-schedule-headers.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/WeeklyShiftSchedule.tsx scripts/patch_schedule_headers.py .github/workflows/patch-schedule-headers.yml
          git diff --cached --quiet || git commit -m 'fix: send schedule sync revision metadata'
          git push
