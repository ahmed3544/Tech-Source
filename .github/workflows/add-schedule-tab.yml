name: Add schedule navigation tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update App and Header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          if "import { WeeklyShiftSchedule } from './components/WeeklyShiftSchedule';" not in s:
              anchor = "import { ImportLeavesView } from './components/ImportLeavesView';"
              assert anchor in s
              s = s.replace(anchor, anchor + "\nimport { WeeklyShiftSchedule } from './components/WeeklyShiftSchedule';", 1)
          s = re.sub(r"(?m)^(\s*\| 'analytics')\s*\n(\s*)\| 'portal'", lambda m: m.group(1) + "\n" + m.group(2) + "| 'schedule'\n" + m.group(2) + "| 'portal'", s)
          if "activeTab === 'schedule'" not in s:
              m = re.search(r"\{activeTab\s*===\s*['\"]portal['\"]\s*&&\s*\(", s)
              assert m
              block = "{activeTab === 'schedule' && (\n          <WeeklyShiftSchedule\n            lang={lang}\n            onClose={() => setActiveTab(currentUser?.role === 'leader' || !currentUser ? 'dashboard' : 'portal')}\n          />\n        )}\n\n        "
              s = s[:m.start()] + block + s[m.start():]
          s = re.sub(r"\n\s*onSaveDailyShift=\{handleSaveDailyShift\}", "", s, count=1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"(?m)^(\s*\| 'analytics')\s*\n(\s*)\| 'portal'", lambda m: m.group(1) + "\n" + m.group(2) + "| 'schedule'\n" + m.group(2) + "| 'portal'", s)
          if "setActiveTab('schedule')" not in s:
              m = re.search(r"<button\s+onClick=\{\(\) => setActiveTab\('analytics'\)\}.*?</button>", s, re.S)
              assert m
              schedule = '''\n              <button\n                onClick={() => setActiveTab('schedule')}\n                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${\n                  activeTab === 'schedule'\n                    ? 'bg-[#0d2240] text-white font-bold border border-blue-900 shadow-md'\n                    : 'text-slate-400 hover:text-white hover:bg-slate-800'\n                }`}\n              >\n                <CalendarCheck className="w-4 h-4 text-emerald-400" />\n                <span>{lang === 'ar' ? 'الجدول' : 'Schedule'}</span>\n              </button>'''
              s = s[:m.end()] + schedule + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY

      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Header.tsx
          git diff --cached --quiet || git commit -m "Add weekly schedule navigation tab"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/add-schedule-tab.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary schedule tab workflow"
          git push || true
