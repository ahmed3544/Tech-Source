name: Refine professional UI copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update UI copy
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'src/components/KioskPunch.tsx': {
              'يمكنك تسجيل الحضور في أي وقت خلال أو بعد ساعات الإذن دون انتطار.': 'يمكن تسجيل الحضور خلال فترة الإذن أو بعدها.',
              'Check-in is allowed at any time during or after permission hours.': 'Check-in is permitted during or after the approved permission period.',
              'لا يمكنك تسجيل الانصراف أثناء التواجد في استراحة نشطة. يرجى تسجيل العودة من الاستراحة أولاً ثم المحاولة مرة أخرى.': 'يرجى إنهاء الاستراحة قبل تسجيل الانصراف.',
              'You are currently on an active break. Please end your break before checking out.': 'Please end the active break before checking out.',
              'ملاحظة إضافية (مثل سبب التأخير أو مهمة خارجية)...': 'ملاحظات إضافية...',
              'تنويه هام: الوقت الحالي تجاوز الساعة 10:00:00 AM (أكثر من ساعة تأخير عن الوردية). تسجيل الحضور الآن يُسجّل كـ "غائب".': 'تجاوز وقت التسجيل الساعة 10:00 صباحًا. سيتم تسجيل الحضور كـ "غائب".',
              'Notice: Time is past 10:00:00 AM (>1 hour late). Clocking in now will record status as "Absent".': 'Check-in after 10:00 AM will be recorded as "Absent".',
              'تنويه: التسجيل بعد الساعة 09:10:00 AM يُحسب "متأخر" (التأخير: ${lateCheck.lateMinutes} دقيقة و ${lateCheck.lateSeconds} ثانية)': 'التسجيل بعد الساعة 09:10 صباحًا يُسجل كـ "متأخر" (${lateCheck.lateMinutes} دقيقة و${lateCheck.lateSeconds} ثانية).',
              'Notice: Clocking in after 09:00:00 AM marks as Late (${lateCheck.formattedLateDuration})': 'Check-in after 09:00 AM is recorded as "Late" (${lateCheck.formattedLateDuration}).',
              'ساعة النظام الحية (12H)': 'وقت النظام',
              'Live System Clock': 'System Time',
            },
            'src/components/DataImportModal.tsx': {
              'يمكنك لصق CSV أو TSV أو JSON.': 'الصيغ المدعومة: CSV، TSV، JSON',
              'You can paste CSV, TSV or JSON.': 'Supported formats: CSV, TSV, JSON',
            },
            'src/components/ImportLeavesView.tsx': {
              '⚠️ يوجد {failedRows.length} صف تعذر استيرادها أو تم تجاوزها. يمكنك تحميل تقرير الأخطاء الآن.': 'تعذر استيراد {failedRows.length} صفًا.',
              '... وعرض {parsedRows.length - 20} صف إضافي سيتم معالجتها عند التأكيد.': 'سيتم استيراد بقية الصفوف عند التأكيد.',
            },
            'src/components/UrgentNoticeModal.tsx': {
              'سيظهر هذا التنبيه بصورة فورية وبارزة لجميع الموظفين على الصفحة الرئيسية': 'يظهر التنبيه لجميع الموظفين في الصفحة الرئيسية.',
              'This notice will immediately appear to all employees on their portals.': 'The notice will appear on all employees’ home pages.',
            },
            'src/components/BulkAttendanceModal.tsx': {
              '(سيتم اختيار ${numberOfDays} أيام عمل بدءاً من ${startDate})': '(${numberOfDays} يوم عمل بدءًا من ${startDate})',
              '(${numberOfDays} workdays starting from ${startDate})': '(${numberOfDays} workdays from ${startDate})',
              'سيتم تحديثها': 'سجلات للتحديث',
              'To Update': 'Records to update',
            },
            'src/components/LeaveManager.tsx': {
              'هل أنت تأكد من إلغاء هذه الإجازة المعتمدة؟ (سيتم استرجاع رصيد الموظف وإلغاء السجلات تلقائياً)': 'هل تريد إلغاء الإجازة المعتمدة؟',
              'تم إلغاء الإجازة وتحديث الرصيد': 'تم إلغاء الإجازة وتحديث الرصيد.',
              'اختر صورة التقرير الطبي من جهازك': 'إرفاق التقرير الطبي',
            },
            'src/components/AttendanceLogTable.tsx': {
              'هل أنت تأكد من حذف هذا السجل؟ (سيتم إلغاء الإجازة واسترجاع رصيد الموظف تلقائياً)': 'هل تريد حذف هذا السجل؟',
              'سيتم تسجيل هذا اليوم كعطلة أسبوعية معتمدة للموظف، ولن يتم احتساب أي غياب أو تأخير أو خصومات مالية عنه في التقرير.': 'سيتم تسجيل اليوم كعطلة أسبوعية معتمدة.',
              'This date will be marked as an approved weekly weekend off-day without any late deductions or absence.': 'The date will be recorded as an approved weekly day off.',
            },
            'src/components/EmployeeManager.tsx': {
              'هل أنت تأكد من رغبتك في حذف هذا الموظف؟ سيتم حذف جميع بياناته وسجلاته نهائياً ولن يظهر مرة أخرى.': 'هل تريد حذف الموظف؟ سيتم حذف بياناته وسجلاته نهائيًا.',
            },
            'src/components/AvatarModal.tsx': {
              '2. أو اختر من الصور الجاهزة:': 'اختر صورة جاهزة',
              '2. Or select a preset avatar:': 'Select a preset avatar',
            },
            'src/components/NotificationCenter.tsx': {
              'طلب overtime جديد': 'طلب عمل إضافي جديد',
              'تم قبول Overtime': 'تم اعتماد العمل الإضافي',
            },
          }
          changed = []
          for file, mapping in replacements.items():
            p = Path(file)
            if not p.exists():
              continue
            s = p.read_text(encoding='utf-8')
            original = s
            for old, new in mapping.items():
              s = s.replace(old, new)
            if s != original:
              p.write_text(s, encoding='utf-8')
              changed.append(file)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: TypeScript check
        run: |
          npm ci
          npm run lint
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/professional-ui-copy.yml
          git add src/components
          if ! git diff --cached --quiet; then git commit -m "Refine professional UI copy"; fi
          git push
