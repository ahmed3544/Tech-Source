name: Finalize employee schedule tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace employee navigation block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"/\* EMPLOYEE ONLY NAVIGATION \*/[\s\S]*?\n\s*\)\}\s*\n\s*</div>\s*\n\s*</nav>")
          m = pattern.search(s)
          assert m, 'Employee navigation block not found'
          block = '''/* EMPLOYEE ONLY NAVIGATION */
            <>
              <button
                onClick={() => setActiveTab('portal')}
                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                  activeTab === 'portal'
                    ? 'bg-[#0d2240] text-white font-bold border border-blue-900 shadow-md'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/80'
                }`}
              >
                <User className="w-4 h-4 text-emerald-400" />
                <span>
                  {lang === 'ar'
                    ? 'لوحة الموظف'
                    : 'My Account Dashboard'}
                </span>
              </button>

              <button
                onClick={() => setActiveTab('schedule')}
                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                  activeTab === 'schedule'
                    ? 'bg-[#0d2240] text-white font-bold border border-blue-900 shadow-md'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/80'
                }`}
              >
                <CalendarCheck className="w-4 h-4 text-emerald-400" />
                <span>
                  {lang === 'ar' ? 'الجدول' : 'Schedule'}
                </span>
              </button>
            </>

          )}

        </div>
      </nav>'''
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx
          git diff --cached --quiet || git commit -m "Add schedule tab to employee navigation"
          git push
      - name: Remove workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/final-employee-schedule.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary employee schedule workflow"
          git push || true
