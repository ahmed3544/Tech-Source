name: Finalize FCM source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-fcm-source.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FCM source wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          if './server/fcm.js' not in s:
              s = s.replace('import * as schema from "./src/db/schema.js";','import * as schema from "./src/db/schema.js";\nimport { registerFcmRoutes } from "./server/fcm.js";')
          if 'registerFcmRoutes(app);' not in s:
              s = s.replace('const app = express();','const app = express();\nregisterFcmRoutes(app);')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: persist FCM server wiring"
          git push origin HEAD:main
