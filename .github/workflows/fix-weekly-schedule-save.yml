name: Fix weekly schedule save

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_weekly_schedule_save.py

      - name: Remove patch tooling and commit
        run: |
          rm -f scripts/patch_weekly_schedule_save.py .github/workflows/fix-weekly-schedule-save.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WeeklyShiftSchedule.tsx scripts/patch_weekly_schedule_save.py .github/workflows/fix-weekly-schedule-save.yml
          git diff --cached --check
          git commit -m "fix: harden weekly schedule save diagnostics"
          git push
