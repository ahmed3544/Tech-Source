name: Remove legacy daily shift UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-legacy-shift-ui:
    if: contains(github.event.head_commit.message, 'Remove legacy daily shift UI workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy daily shift controls
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/EmployeePortal.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'\n\s*\{\/\* Daily shift: employees see only their own assignment; leaders can assign it day by day\. \*\/\}\s*<section className="bg-sky-50 border border-sky-200 rounded-3xl p-5 space-y-4">.*?</section>\s*', re.S)
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('Legacy daily shift section was not found exactly once')

          text = text.replace("  onSaveDailyShift: (assignment: DailyShiftAssignment) => void;\n", '')
          text = text.replace("  onSaveDailyShift,\n", '')
          text = text.replace("  const [shiftDate, setShiftDate] = useState(getTodayString());\n", '')
          text = text.replace("  const [selectedShiftId, setSelectedShiftId] = useState('');\n", '')

          path.write_text(text, encoding='utf-8')

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remove-old-daily-shift-ui.yml
          git add src/components/EmployeePortal.tsx .github/workflows/remove-old-daily-shift-ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove legacy daily shift UI"
          git push