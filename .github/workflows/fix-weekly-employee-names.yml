name: Fix weekly schedule employee list
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch weekly schedule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/WeeklyShiftSchedule.tsx')
          s = p.read_text()
          old = """        if ((!suppliedEmployees?.length || !suppliedShifts?.length) && !cancelled) {\n          setLoading(true);\n          const response = await fetch('/api/data');\n          if (response.ok) {\n            const data = await response.json();\n            if (!cancelled) {\n              if (Array.isArray(data.employees)) setEmployees(data.employees);\n              if (Array.isArray(data.shifts)) setShifts(data.shifts);\n              if (Array.isArray(data.dailyShiftAssignments)) setAssignments(data.dailyShiftAssignments);\n            }\n          }\n        }"""
          new = """        if (!cancelled && !suppliedEmployees?.length) {\n          try {\n            const storedEmployees = localStorage.getItem('attendance_employees');\n            if (storedEmployees) {\n              const parsedEmployees = JSON.parse(storedEmployees);\n              if (Array.isArray(parsedEmployees) && parsedEmployees.length) {\n                setEmployees(parsedEmployees);\n                if (!suppliedUser && storedUser) {\n                  const parsedUser = JSON.parse(storedUser) as Employee;\n                  const canonicalUser = parsedEmployees.find((item: Employee) => item.id === parsedUser.id);\n                  if (canonicalUser) {\n                    setCurrentUser(canonicalUser);\n                    setSelectedEmployeeId(canonicalUser.id);\n                  }\n                }\n              }\n            }\n          } catch {}\n        }\n        if ((!suppliedEmployees?.length || !suppliedShifts?.length) && !cancelled) {\n          setLoading(true);\n          const response = await fetch('/api/data', { cache: 'no-store' });\n          if (response.ok) {\n            const data = await response.json();\n            if (!cancelled) {\n              if (Array.isArray(data.employees) && data.employees.length) {\n                setEmployees(data.employees);\n                if (storedUser && !suppliedUser) {\n                  try {\n                    const parsedUser = JSON.parse(storedUser) as Employee;\n                    const canonicalUser = data.employees.find((item: Employee) => item.id === parsedUser.id);\n                    if (canonicalUser) {\n                      setCurrentUser(canonicalUser);\n                      setSelectedEmployeeId(canonicalUser.id);\n                    }\n                  } catch {}\n                }\n              }\n              if (Array.isArray(data.shifts)) setShifts(data.shifts);\n              if (Array.isArray(data.dailyShiftAssignments)) setAssignments(data.dailyShiftAssignments);\n            }\n          }\n        }"""
          if old not in s:
              raise SystemExit('expected load block not found')
          s = s.replace(old, new, 1)
          old2 = """  const employee = visibleEmployees.find(e => e.id === selectedEmployeeId) || visibleEmployees[0];\n\n  useEffect(() => {"""
          new2 = """  const selectableEmployees = isLeader && visibleEmployees.length === 0 ? employees : visibleEmployees;\n  const employee = selectableEmployees.find(e => e.id === selectedEmployeeId) || selectableEmployees[0];\n\n  useEffect(() => {"""
          if old2 not in s:
              raise SystemExit('expected employee block not found')
          s = s.replace(old2, new2, 1)
          s = s.replace("setSelectedEmployeeIds(prev => prev.filter(id => visibleEmployees.some(e => e.id === id)));", "setSelectedEmployeeIds(prev => prev.filter(id => selectableEmployees.some(e => e.id === id)));", 1)
          s = s.replace("[employee, selectedEmployeeId, visibleEmployees]", "[employee, selectedEmployeeId, selectableEmployees]", 1)
          s = s.replace("{visibleEmployees.map(e => <option", "{selectableEmployees.map(e => <option", 1)
          s = s.replace("setSelectedEmployeeIds(visibleEmployees.map(e => e.id))", "setSelectedEmployeeIds(selectableEmployees.map(e => e.id))", 1)
          s = s.replace("{visibleEmployees.map(e => <label", "{selectableEmployees.map(e => <label", 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WeeklyShiftSchedule.tsx
          git commit -m "fix: load employee names in weekly schedule" || true
          git rm .github/workflows/fix-weekly-employee-names.yml
          git commit -m "chore: remove temporary weekly schedule workflow" || true
          git push