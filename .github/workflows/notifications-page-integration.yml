name: Integrate Full Notifications Page

on:
  push:
    branches: [main]

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire notifications page
        shell: python
        run: |
          from pathlib import Path
          app = Path('src/App.tsx')
          s = app.read_text(encoding='utf-8')
          if "from './components/NotificationsPage'" not in s:
              s = s.replace("import { NotificationCenter } from './components/NotificationCenter';", "import { NotificationCenter } from './components/NotificationCenter';\nimport { NotificationsPage } from './components/NotificationsPage';")
          s = s.replace("      | 'portal'\n    >('dashboard');", "      | 'notifications'\n      | 'portal'\n    >('dashboard');", 1)
          marker = "        {activeTab === 'portal' && ("
          if marker in s and "activeTab === 'notifications'" not in s:
              page = """        {activeTab === 'notifications' && (\n          <NotificationsPage\n            notifications={notifications}\n            currentUserId={currentUserId || currentUser?.id}\n            lang={lang}\n            onMarkAsRead={handleMarkNotificationAsRead}\n            onMarkAllAsRead={handleMarkAllNotificationsAsRead}\n            onBack={() => setActiveTab(currentUser?.role === 'leader' || !currentUser ? 'dashboard' : 'portal')}\n          />\n        )}\n\n"""
              s = s.replace(marker, page + marker, 1)
          headerProps = "      onMarkAllNotificationsAsRead={handleMarkAllNotificationsAsRead}"
          # App Header uses the same prop names; add the navigation callback once.
          if headerProps in s and "onOpenNotificationsPage" not in s:
              s = s.replace(headerProps, headerProps + "\n        onOpenNotificationsPage={() => setActiveTab('notifications')}", 1)
          app.write_text(s, encoding='utf-8')

          h = Path('src/components/Header.tsx')
          hs = h.read_text(encoding='utf-8')
          hs = hs.replace("    | 'portal';", "    | 'notifications'\n    | 'portal';", 1)
          hs = hs.replace("      | 'portal'\n  ) => void;", "      | 'notifications'\n      | 'portal'\n  ) => void;", 1)
          hs = hs.replace("  onMarkAllNotificationsAsRead?: () => void;", "  onMarkAllNotificationsAsRead?: () => void;\n  onOpenNotificationsPage?: () => void;", 1)
          hs = hs.replace("  onMarkAllNotificationsAsRead,\n}) => {", "  onMarkAllNotificationsAsRead,\n  onOpenNotificationsPage,\n}) => {", 1)
          old = "<NotificationCenter notifications={notifications} currentUserId={currentUserId || currentUser.id} lang={lang} onMarkAsRead={onMarkNotificationAsRead} onMarkAllAsRead={onMarkAllNotificationsAsRead} />"
          new = "<NotificationCenter notifications={notifications} currentUserId={currentUserId || currentUser.id} lang={lang} onMarkAsRead={onMarkNotificationAsRead} onMarkAllAsRead={onMarkAllNotificationsAsRead} onOpenPage={onOpenNotificationsPage} />"
          hs = hs.replace(old, new, 1)
          h.write_text(hs, encoding='utf-8')

      - name: Build and verify
        run: |
          npm install
          npm run build
          grep -q "NotificationsPage" src/App.tsx
          grep -q "onOpenNotificationsPage" src/components/Header.tsx
          grep -q "onOpenPage" src/components/NotificationCenter.tsx
          echo "Full notifications page integration verified"

      - name: Commit and push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Header.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: navigate bell to full notifications page"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
