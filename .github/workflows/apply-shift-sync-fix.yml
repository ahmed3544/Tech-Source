name: Apply shift sync fix

on:
  push:
    branches: [fix/multi-device-shift-sync-live]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-shift-sync.cjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix multi-device shift assignment sync"
          git push origin HEAD:${{ github.ref_name }}
