name: Normalize Notifications Now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize duplicate notification declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def collapse_consecutive(path, exact):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
              out, previous = [], False
              for line in lines:
                  hit = line.strip() == exact
                  if hit and previous:
                      continue
                  out.append(line)
                  previous = hit
              p.write_text(''.join(out), encoding='utf-8')

          collapse_consecutive('src/App.tsx', "| 'notifications'")
          collapse_consecutive('src/components/Header.tsx', "| 'notifications'")

          p = Path('src/components/Header.tsx')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          out, seen_prop = [], False
          for line in lines:
              if line.strip() == 'onOpenNotificationsPage?: () => void;':
                  if seen_prop:
                      continue
                  seen_prop = True
              out.append(line)
          p.write_text(''.join(out), encoding='utf-8')
          PY

      - name: Build
        run: npm install && npm run build

      - name: Verify
        run: |
          test "$(grep -c "| 'notifications'" src/App.tsx)" -eq 1
          test "$(grep -c "| 'notifications'" src/components/Header.tsx)" -eq 1
          test "$(grep -c "onOpenNotificationsPage?:" src/components/Header.tsx)" -eq 1

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Header.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove duplicate notification declarations"
          git push origin HEAD:main
