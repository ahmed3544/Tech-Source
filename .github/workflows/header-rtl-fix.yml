name: Header RTL fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch header, navbar CSS, and EmployeePortal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">', '<header dir={lang === \'ar\' ? \'rtl\' : \'ltr\'} className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">', 1)
          s = s.replace('<nav className="bg-slate-950/80 border-t border-slate-800/80 px-4 sm:px-6">', '<nav dir={lang === \'ar\' ? \'rtl\' : \'ltr\'} className="bg-slate-950/80 border-t border-slate-800/80 px-4 sm:px-6">', 1)
          s = s.replace('className="max-w-7xl mx-auto flex items-center gap-1.5 overflow-x-auto py-1.5 scrollbar-none"', 'className="max-w-7xl mx-auto flex items-center gap-3 overflow-x-auto py-1.5 scrollbar-none"', 1)
          p.write_text(s, encoding='utf-8')

          css = Path('src/index.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* Header/Navbar tabs: deterministic RTL/LTR direction'
          if marker not in s:
              s += '''\n\n/* Header/Navbar tabs: deterministic RTL/LTR direction, clean Arabic typography, and safe horizontal scrolling. */\n#root header nav { direction: rtl; font-family: 'Cairo', Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }\n#root header nav > div { display: flex; align-items: center; gap: 12px !important; min-width: 0; max-width: 100%; overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap; scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; }\n#root header nav > div::-webkit-scrollbar { display: none; }\n#root header nav button { flex: 0 0 auto !important; white-space: nowrap !important; min-width: max-content; max-width: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Cairo', Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700 !important; letter-spacing: 0 !important; direction: inherit; }\n#root header nav button span { white-space: nowrap !important; letter-spacing: 0 !important; font-weight: 700 !important; }\n@media (max-width: 767px) { #root header nav { padding-left: 8px; padding-right: 8px; } #root header nav > div { gap: 12px !important; padding-top: 4px; padding-bottom: 4px; } #root header nav button { font-size: 0.75rem !important; line-height: 1.25 !important; padding-left: 10px; padding-right: 10px; } }\n@media (max-width: 390px) { #root header nav button { font-size: 0.71rem !important; padding-left: 9px; padding-right: 9px; } }\n'''
              css.write_text(s, encoding='utf-8')

          # Restore the complete known-good EmployeePortal source, then apply only
          # the requested UI fixes. This also removes the accidental placeholder.
          ep = Path('src/components/EmployeePortal.tsx')
          import subprocess
          baseline = subprocess.check_output([
              'git', 'show',
              '7402c391f9fb380aa006c8987c08928eccd11424:src/components/EmployeePortal.tsx'
          ], text=True)
          s = baseline

          bad = '''          </div>\n\n          </div>\n        </div>\n\n        {/* CARD 3: TOTAL WORK HOURS & STATS */}'''
          good = '''          </div>\n        </div>\n\n        {/* CARD 3: TOTAL WORK HOURS & STATS */}'''
          if bad not in s:
              raise SystemExit('Expected extra closing div before CARD 3 was not found')
          s = s.replace(bad, good, 1)

          badge_old = 'className="bg-amber-400 text-slate-950 text-[11px] font-black px-2.5 py-0.5 rounded-full font-mono shadow-sm"'
          badge_new = 'className="bg-amber-400 text-slate-950 text-[11px] font-black px-2.5 py-0.5 rounded-full font-mono shadow-sm inline-flex items-center whitespace-nowrap shrink-0 leading-none"'
          if badge_old in s:
              s = s.replace(badge_old, badge_new, 1)
          ep.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Full production build verification
        run: npm run build

      - name: Verify expected source state
        run: |
          set -euo pipefail
          grep -q "OFFICIAL PUBLIC HOLIDAYS BANNER" src/components/EmployeePortal.tsx
          grep -q "whitespace-nowrap shrink-0 leading-none" src/components/EmployeePortal.tsx
          ! grep -q "Placeholder prevented" src/components/EmployeePortal.tsx

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Header.tsx src/index.css src/components/EmployeePortal.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix navbar RTL layout and EmployeePortal JSX'
          git push
