name: Verified Repair EmployeePortal

on:
  push:
    branches: [main]

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good file and apply minimal fixes
        shell: bash
        run: |
          set -euo pipefail
          git show 7402c391f9fb380aa006c8987c08928eccd11424:src/components/EmployeePortal.tsx > src/components/EmployeePortal.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/EmployeePortal.tsx')
          s = p.read_text(encoding='utf-8')

          # The baseline already contains the requested top permission button and
          # does not contain the lower duplicate button. Keep it unchanged.
          bad = '''          </div>\n\n          </div>\n        </div>\n\n        {/* CARD 3: TOTAL WORK HOURS & STATS */}'''
          good = '''          </div>\n        </div>\n\n        {/* CARD 3: TOTAL WORK HOURS & STATS */}'''
          if bad not in s:
              raise SystemExit('Expected extra closing div before CARD 3 was not found')
          s = s.replace(bad, good, 1)

          badge_old = 'className="bg-amber-400 text-slate-950 text-[11px] font-black px-2.5 py-0.5 rounded-full font-mono shadow-sm"'
          badge_new = 'className="bg-amber-400 text-slate-950 text-[11px] font-black px-2.5 py-0.5 rounded-full font-mono shadow-sm inline-flex items-center whitespace-nowrap shrink-0 leading-none"'
          if badge_old in s:
              s = s.replace(badge_old, badge_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Full production build verification
        run: npm run build

      - name: Verify expected source state
        shell: bash
        run: |
          set -euo pipefail
          grep -q "OFFICIAL PUBLIC HOLIDAYS BANNER" src/components/EmployeePortal.tsx
          grep -q "whitespace-nowrap shrink-0 leading-none" src/components/EmployeePortal.tsx
          ! grep -q "Placeholder prevented" src/components/EmployeePortal.tsx

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EmployeePortal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair EmployeePortal JSX and verify production build"
          git push origin HEAD:main
