name: Apply Complete English i18n

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_complete_english_i18n.cjs'
      - '.github/workflows/apply-complete-english-i18n.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply localization patch
        run: node scripts/apply_complete_english_i18n.cjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/helpers.ts src/components/EmployeePortal.tsx src/components/AttendanceLogTable.tsx src/components/LeaveManager.tsx src/components/DashboardOverview.tsx src/components/AnalyticsView.tsx src/components/TeamOverallReport.tsx src/components/EmployeeManager.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: enforce English UI localization and backend fallbacks"
          git push origin HEAD:main
