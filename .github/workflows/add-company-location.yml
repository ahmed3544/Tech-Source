name: Add Company Location

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-company-location.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement company geofence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # types.ts
          p = Path('src/types.ts')
          s = p.read_text()
          if 'export interface CompanyLocation' not in s:
              marker = "export interface ShiftBreak {"
              insert = """export interface CompanyLocation {\n  latitude: number;\n  longitude: number;\n  radiusMeters: number;\n  updatedAt?: string;\n}\n\n"""
              if marker not in s:
                  raise SystemExit('types marker not found')
              s = s.replace(marker, insert + marker, 1)
              p.write_text(s)

          # server.ts: state + data + sync + server-side geofence.
          p = Path('server.ts')
          s = p.read_text()
          if 'companyLocation?: any;' not in s:
              # Add state field next to dailyShiftAssignments when present.
              s, n = re.subn(r'(dailyShiftAssignments\?: any\[\];)', r'\1\n  companyLocation?: any;', s, count=1)
              if n == 0:
                  # Fallback to first local-state interface closing area.
                  s = s.replace('interface LocalState {', 'interface LocalState {\n  companyLocation?: any;', 1)

          if 'companyLocation: settings.companyLocation ?? null' not in s:
              marker = 'dailyShiftAssignments: settings.dailyShiftAssignments ?? localState.dailyShiftAssignments,'
              if marker in s:
                  s = s.replace(marker, marker + '\n    companyLocation: settings.companyLocation ?? localState.companyLocation ?? null,', 1)
              else:
                  # Use the existing data object before its closing brace.
                  marker2 = 'dailyShiftAssignments: settings.dailyShiftAssignments ?? localState.dailyShiftAssignments'
                  if marker2 not in s:
                      raise SystemExit('data dailyShiftAssignments marker not found')
                  s = s.replace(marker2, marker2 + ',\n    companyLocation: settings.companyLocation ?? localState.companyLocation ?? null', 1)

          if 'if (Array.isArray(b.companyLocation))' not in s and 'b.companyLocation' not in s:
              # companyLocation is an object, so persist it with a truthy object check.
              marker = 'if (Array.isArray(b.shifts)) await setting("shiftTemplates", b.shifts);'
              if marker in s:
                  s = s.replace(marker, marker + '\n      if (b.companyLocation && typeof b.companyLocation === "object") await setting("companyLocation", b.companyLocation);', 1)
              else:
                  marker = 'if (Array.isArray(b.dailyShiftAssignments)) await setting("dailyShiftAssignments", b.dailyShiftAssignments);'
                  if marker in s:
                      s = s.replace(marker, marker + '\n      if (b.companyLocation && typeof b.companyLocation === "object") await setting("companyLocation", b.companyLocation);', 1)
                  else:
                      raise SystemExit('supabase sync marker not found')

          if 'localState.companyLocation = b.companyLocation;' not in s:
              marker = 'if (Array.isArray(b.dailyShiftAssignments)) localState.dailyShiftAssignments = b.dailyShiftAssignments;'
              if marker in s:
                  s = s.replace(marker, marker + '\n    if (b.companyLocation && typeof b.companyLocation === "object") localState.companyLocation = b.companyLocation;', 1)
              else:
                  raise SystemExit('local sync marker not found')

          # Insert geofence helpers immediately before the /api/punch handler.
          if 'function isWithinCompanyLocation(' not in s:
              marker = "app.post('/api/punch'"
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('api punch marker not found')
              helper = r'''function isWithinCompanyLocation(location: unknown, companyLocation: any): boolean {
  if (!companyLocation || typeof companyLocation !== 'object') return false;
  const lat = Number((companyLocation as any).latitude);
  const lng = Number((companyLocation as any).longitude);
  const radius = Math.max(1, Number((companyLocation as any).radiusMeters) || 100);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;
  const raw = String(location ?? '').trim();
  const match = raw.match(/^(-?\d+(?:\.\d+)?)[, ]+(-?\d+(?:\.\d+)?)(?:[, ]+(\d+(?:\.\d+)?))?$/);
  if (!match) return false;
  const userLat = Number(match[1]);
  const userLng = Number(match[2]);
  const accuracy = Math.max(0, Number(match[3] || 0));
  if (!Number.isFinite(userLat) || !Number.isFinite(userLng)) return false;
  const toRad = (v: number) => v * Math.PI / 180;
  const dLat = toRad(userLat - lat);
  const dLng = toRad(userLng - lng);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat)) * Math.cos(toRad(userLat)) * Math.sin(dLng / 2) ** 2;
  const distance = 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return distance <= radius + accuracy;
}

'''
              s = s[:idx] + helper + s[idx:]

          # Enforce only check-in/check-out at the server. Break administration remains unaffected.
          if 'COMPANY_LOCATION_REQUIRED' not in s:
              marker = '  if (!employeeId) {'
              idx = s.find(marker, s.find("app.post('/api/punch'"))
              if idx < 0:
                  raise SystemExit('employeeId validation marker not found')
              block = '''  const locationForValidation = record?.location ?? req.body?.location ?? '';\n  if ((action === 'check_in' || action === 'check_out') && !isWithinCompanyLocation(locationForValidation, settings.companyLocation ?? localState.companyLocation)) {\n    const configured = settings.companyLocation ?? localState.companyLocation;\n    return res.status(403).json({\n      success: false,\n      code: configured ? 'OUTSIDE_COMPANY_LOCATION' : 'COMPANY_LOCATION_REQUIRED',\n      error: configured ? 'Attendance is only allowed from the company location.' : 'Company location has not been configured.'\n    });\n  }\n\n'''
              s = s[:idx] + block + s[idx:]
          p.write_text(s)

          # KioskPunch.tsx: browser geolocation + leader configuration.
          p = Path('src/components/KioskPunch.tsx')
          s = p.read_text()
          if 'CompanyLocation' not in s.split("from '../types'")[0] + s[:s.find("from '../types'")+30]:
              s = s.replace("Employee, Shift, AttendanceRecord, LeaveRequest, Language", "Employee, Shift, AttendanceRecord, LeaveRequest, Language, CompanyLocation", 1)

          s = s.replace("  const [breakWarningModal, setBreakWarningModal] = useState<boolean>(false);", """  const [breakWarningModal, setBreakWarningModal] = useState<boolean>(false);\n  const [companyLocation, setCompanyLocation] = useState<CompanyLocation | null>(null);\n  const [locationBusy, setLocationBusy] = useState(false);\n  const [locationStatus, setLocationStatus] = useState<string | null>(null);""", 1)

          if 'const loadCompanyLocation' not in s:
              marker = "  // Live timer tick every 1000ms"
              insert = r'''  const loadCompanyLocation = async () => {
    try {
      const response = await fetch('/api/data');
      if (!response.ok) return;
      const data = await response.json();
      if (data?.companyLocation) setCompanyLocation(data.companyLocation as CompanyLocation);
      else setCompanyLocation(null);
    } catch {
      // Keep the current cached state if the server is temporarily unavailable.
    }
  };

  useEffect(() => {
    void loadCompanyLocation();
  }, []);

'''
              s = s.replace(marker, insert + marker, 1)

          if 'const setCompanyLocationFromDevice' not in s:
              marker = "  const handleAction = (action: 'check_in' | 'check_out' | 'break_start' | 'break_end' | 'force_break_end') => {"
              replacement = r'''  const setCompanyLocationFromDevice = () => {
    if (!navigator.geolocation) {
      setLocationStatus(lang === 'ar' ? 'المتصفح لا يدعم تحديد الموقع.' : 'Geolocation is not supported by this browser.');
      return;
    }
    setLocationBusy(true);
    setLocationStatus(null);
    navigator.geolocation.getCurrentPosition(async position => {
      const next: CompanyLocation = {
        latitude: Number(position.coords.latitude.toFixed(7)),
        longitude: Number(position.coords.longitude.toFixed(7)),
        radiusMeters: companyLocation?.radiusMeters || 150,
        updatedAt: new Date().toISOString(),
      };
      try {
        const response = await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyLocation: next }),
        });
        if (!response.ok) throw new Error('sync failed');
        localStorage.setItem('company_location', JSON.stringify(next));
        setCompanyLocation(next);
        setLocationStatus(lang === 'ar' ? 'تم حفظ موقع الشركة.' : 'Company location saved.');
      } catch {
        setLocationStatus(lang === 'ar' ? 'تعذر حفظ موقع الشركة.' : 'Unable to save company location.');
      } finally {
        setLocationBusy(false);
      }
    }, () => {
      setLocationBusy(false);
      setLocationStatus(lang === 'ar' ? 'تعذر تحديد الموقع. اسمح للمتصفح بالوصول إلى الموقع ثم حاول مرة أخرى.' : 'Unable to determine your location. Allow browser location access and try again.');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  };

  const getPunchLocation = (): Promise<string | null> => new Promise(resolve => {
    if (!navigator.geolocation) {
      setErrorMsg(lang === 'ar' ? 'المتصفح لا يدعم تحديد الموقع.' : 'Geolocation is not supported by this browser.');
      resolve(null);
      return;
    }
    navigator.geolocation.getCurrentPosition(position => {
      const accuracy = Math.max(0, Math.round(position.coords.accuracy || 0));
      resolve(`${position.coords.latitude},${position.coords.longitude},${accuracy}`);
    }, () => {
      setErrorMsg(lang === 'ar' ? 'لا يمكن تسجيل الحضور أو الانصراف بدون السماح بتحديد الموقع.' : 'Check-in and check-out require location access.');
      resolve(null);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });

  const handleAction = async (action: 'check_in' | 'check_out' | 'break_start' | 'break_end' | 'force_break_end') => {'''
              if marker not in s:
                  raise SystemExit('handleAction marker not found')
              s = s.replace(marker, replacement, 1)

          # Replace the direct onPunch call with location capture for attendance actions.
          old = "    setErrorMsg(null);\n    onPunch(selectedEmp.id, action, '', noteInput);"
          new = """    setErrorMsg(null);\n    let punchLocation = '';\n    if (action === 'check_in' || action === 'check_out') {\n      if (!companyLocation) {\n        await loadCompanyLocation();\n        if (!companyLocation) {\n          setErrorMsg(lang === 'ar' ? 'لم يتم تحديد موقع الشركة بعد. يجب على الليدر تحديد موقع الشركة أولاً.' : 'Company location is not configured yet. A leader must set it first.');\n          playAudioTone('error');\n          return;\n        }\n      }\n      const currentLocation = await getPunchLocation();\n      if (!currentLocation) { playAudioTone('error'); return; }\n      punchLocation = currentLocation;\n    }\n    onPunch(selectedEmp.id, action, punchLocation, noteInput);"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('onPunch call marker not found')

          # Add leader location setup card after the kiosk header.
          if 'تحديد موقع الشركة' not in s:
              marker = "      {/* Warning Notice: Check in after 09:00 AM late or after 10:00 AM absent indicator */}"
              card = r'''      {isLeader && (
        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-sky-50 border border-sky-100 flex items-center justify-center"><MapPin className="w-5 h-5 text-sky-600" /></div>
            <div>
              <div className="text-sm font-black text-slate-900">{lang === 'ar' ? 'موقع الشركة' : 'Company Location'}</div>
              <div className="text-[11px] text-slate-500 mt-0.5">{companyLocation ? `${companyLocation.latitude.toFixed(6)}, ${companyLocation.longitude.toFixed(6)} · ${companyLocation.radiusMeters}m` : (lang === 'ar' ? 'لم يتم تحديد الموقع' : 'Location not configured')}</div>
              {locationStatus && <div className="text-[11px] text-slate-600 mt-1">{locationStatus}</div>}
            </div>
          </div>
          <button type="button" onClick={setCompanyLocationFromDevice} disabled={locationBusy} className="px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 disabled:opacity-60 text-white text-xs font-black inline-flex items-center justify-center gap-2">
            <MapPin className="w-4 h-4" />
            {locationBusy ? (lang === 'ar' ? 'جاري تحديد الموقع...' : 'Locating...') : (lang === 'ar' ? 'تحديد موقع الشركة الحالي' : 'Set Current Company Location')}
          </button>
        </div>
      )}

'''
              if marker not in s:
                  raise SystemExit('warning notice marker not found')
              s = s.replace(marker, card + marker, 1)
          p.write_text(s)
          PY

      - name: TypeScript check
        run: npm run lint

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts server.ts src/components/KioskPunch.tsx
          git diff --cached --quiet || git commit -m "Add company location attendance geofence"
          git push

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/add-company-location.yml
          git commit -m "Remove temporary company location workflow"
          git push
