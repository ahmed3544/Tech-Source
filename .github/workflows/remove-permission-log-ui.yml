name: Remove Legacy Permission Log UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy permission log section and request button
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/EmployeePortal.tsx')
          s = p.read_text(encoding='utf-8')

          # Remove the complete legacy card that contains the monthly permission/leave request log heading.
          marker = "سجل الطلبات والأذونات الشهرية"
          pos = s.find(marker)
          if pos != -1:
              start = s.rfind('\n      <div', 0, pos)
              if start == -1:
                  raise SystemExit('Could not find containing section start')
              depth = 0
              end = None
              i = start
              while i < len(s):
                  nd = s.find('<div', i)
                  nc = s.find('</div>', i)
                  if nc == -1:
                      break
                  if nd != -1 and nd < nc:
                      depth += 1
                      i = nd + 4
                  else:
                      depth -= 1
                      i = nc + 6
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit('Could not find containing section end')
              s = s[:start] + s[end:]

          # Remove the old standalone permission request button from the attendance filter action bar.
          button_marker = "{lang === 'ar' ? 'طلب إذن خروج (ساعتان)' : 'Request Permission'}"
          pos = s.find(button_marker)
          if pos != -1:
              bstart = s.rfind('\n            <button', 0, pos)
              if bstart == -1:
                  raise SystemExit('Could not find permission button start')
              depth = 0
              end = None
              i = bstart
              while i < len(s):
                  no = s.find('<button', i)
                  nc = s.find('</button>', i)
                  if nc == -1:
                      break
                  if no != -1 and no < nc:
                      depth += 1
                      i = no + 7
                  else:
                      depth -= 1
                      i = nc + 9
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit('Could not find permission button end')
              s = s[:bstart] + s[end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build and verify
        run: |
          npm run build
          ! grep -q "سجل الطلبات والأذونات الشهرية" src/components/EmployeePortal.tsx
          ! grep -q "طلب إذن خروج (ساعتان)" src/components/EmployeePortal.tsx

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EmployeePortal.tsx
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: remove legacy permission log UI"
          git pull --rebase origin main
          git push origin HEAD:main
