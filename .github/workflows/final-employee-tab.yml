name: Final employee schedule tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update employee tab
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.find('/* EMPLOYEE ONLY NAVIGATION */')
          assert start >= 0
          if "onClick={() => setActiveTab('schedule')}" not in s[start:]:
              old = '''            <button\n              onClick={() => setActiveTab('portal')}\n              className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${\n                activeTab === 'portal'\n                  ? 'bg-[#0d2240] text-white font-bold border border-blue-900 shadow-md'\n                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/80'\n              }`}\n            >\n              <User className="w-4 h-4 text-emerald-400" />\n\n              <span>\n                {lang === 'ar'\n                  ? 'لوحة الموظف'\n                  : 'My Account Dashboard'}\n              </span>\n            </button>'''
              new = old + '''\n\n            <button\n              onClick={() => setActiveTab('schedule')}\n              className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${\n                activeTab === 'schedule'\n                  ? 'bg-[#0d2240] text-white font-bold border border-blue-900 shadow-md'\n                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/80'\n              }`}\n            >\n              <CalendarCheck className="w-4 h-4 text-emerald-400" />\n              <span>{lang === 'ar' ? 'الجدول' : 'Schedule'}</span>\n            </button>'''
              assert old in s
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx
          git diff --cached --quiet || git commit -m "Add schedule tab for employees"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/final-employee-tab.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary employee tab workflow"
          git push || true
