name: Fix employee schedule tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update employee navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.find('/* EMPLOYEE ONLY NAVIGATION */')
          assert start >= 0
          tail = s[start:]
          if "onClick={() => setActiveTab('schedule')}" not in tail:
              pattern = re.compile(r"(\/\* EMPLOYEE ONLY NAVIGATION \*\/\s*<button[\s\S]*?</button>)")
              m = pattern.search(s[start:])
              assert m
              employee_button = m.group(1)
              schedule_button = '''\n\n            <button\n              onClick={() => setActiveTab('schedule')}\n              className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${\n                activeTab === 'schedule'\n                  ? 'bg-[#0d2240] text-white font-bold border border-blue-900 shadow-md'\n                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/80'\n              }`}\n            >\n              <CalendarCheck className="w-4 h-4 text-emerald-400" />\n              <span>{lang === 'ar' ? 'الجدول' : 'Schedule'}</span>\n            </button>'''
              replacement = employee_button + schedule_button
              absolute_start = start + m.start(1)
              absolute_end = start + m.end(1)
              s = s[:absolute_start] + replacement + s[absolute_end:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx
          git diff --cached --quiet || git commit -m "Add schedule tab to employee navigation"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-employee-schedule-tab.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary employee schedule workflow"
          git push || true
