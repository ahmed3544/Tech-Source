name: Finalize shift safeguards v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "github.event.head_commit.message != 'Finalize shift safeguards'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'Missing target: {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          rep('src/components/WeeklyShiftSchedule.tsx', "    if (suppliedShifts?.length) setShifts(suppliedShifts);", "    if (suppliedShifts) setShifts(suppliedShifts);")
          rep('src/App.tsx', "        shifts.find(\n          s =>\n            s.id ===\n            (dailyAssignment?.shiftId || emp.shiftId)\n        ) ||\n        shifts[0];", "        shifts.find(\n          s =>\n            s.id ===\n            (dailyAssignment?.shiftId || emp.shiftId)\n        ) ||\n        shifts[0];\n\n      if (!shift) {\n        alert(\n          lang === 'ar'\n            ? 'لا توجد وردية محددة لهذا الموظف اليوم. يرجى الرجوع إلى التيم ليدر لتحديد الجدول.'\n            : 'No shift is assigned for this employee today. Please contact the team leader.'\n        );\n        return;\n      }")
          rep('src/App.tsx', "  INITIAL_EMPLOYEES,\n  INITIAL_SHIFTS,\n  INITIAL_ATTENDANCE,", "  INITIAL_EMPLOYEES,\n  INITIAL_ATTENDANCE,")
          PY
      - name: TypeScript check
        run: |
          npm ci
          npm run lint
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize-team-shifts.yml .github/workflows/finalize-team-shifts-v2.yml
          git add src/App.tsx src/components/WeeklyShiftSchedule.tsx
          git diff --cached --quiet || git commit -m "Finalize shift safeguards"
          git push
