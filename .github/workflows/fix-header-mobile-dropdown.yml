name: Fix Responsive Header and Profile Dropdown

on:
  push:
    branches: [main]

jobs:
  fix-header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Header.tsx
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/Header.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace('  Camera,\n  Megaphone,','  Camera,\n  Megaphone,\n  Moon,\n  Sun,\n  ChevronDown,')
          marker="  const [showAvatarModal, setShowAvatarModal] = useState(false);"
          if marker in s and 'showProfileMenu' not in s:
            s=s.replace(marker, marker+"\n  const [showProfileMenu, setShowProfileMenu] = useState(false);\n  const [isDarkMode, setIsDarkMode] = useState(true);\n\n  useEffect(() => {\n    const savedTheme = localStorage.getItem('tech-source-theme');\n    const dark = savedTheme !== 'light';\n    setIsDarkMode(dark);\n    document.documentElement.classList.toggle('dark', dark);\n  }, []);\n\n  const toggleDarkMode = () => {\n    setIsDarkMode(prev => { const next=!prev; localStorage.setItem('tech-source-theme', next?'dark':'light'); document.documentElement.classList.toggle('dark', next); return next; });\n  };")
          s=s.replace('      <div className="max-w-7xl mx-auto px-4 sm:px-6 min-h-[72px] py-2 flex items-center justify-between gap-4">','      <div className="w-full max-w-full mx-auto px-3 sm:px-6 min-h-[60px] sm:min-h-[72px] py-2 flex items-center justify-between gap-2 sm:gap-4 overflow-visible">')
          a=s.index('          {/* Language Switcher */}')
          b=s.index('        </div>\n      </div>', a)
          block='''          <div className="flex items-center justify-between gap-2 sm:gap-3 w-full min-w-0">\n            <div className="flex items-center gap-2 min-w-0 shrink-0">\n              <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="h-9 min-w-9 flex items-center justify-center gap-1.5 px-2 sm:px-3 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-100 border border-slate-700/70 text-xs font-bold transition shrink-0" title={lang === 'ar' ? 'Switch to English' : 'التحويل للغة العربية'}>\n                <Globe className="w-4 h-4 text-sky-400 shrink-0" /><span className="hidden sm:inline text-[11px] font-extrabold whitespace-nowrap">{lang === 'ar' ? 'English' : 'عربي'}</span>\n              </button>\n              <button onClick={onOpenRulesModal} className="hidden sm:flex h-9 items-center justify-center gap-1.5 px-2.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold transition shrink-0"><Scale className="w-3.5 h-3.5 text-amber-400" /><span className="whitespace-nowrap">{lang === 'ar' ? 'لائحة الشركة' : 'Company Rules'}</span></button>\n              {isLeader && onOpenNoticeModal && <button onClick={onOpenNoticeModal} className="hidden md:flex h-9 items-center justify-center gap-1.5 px-2.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 text-xs font-bold transition shrink-0"><Megaphone className="w-3.5 h-3.5 text-rose-400" /><span className="whitespace-nowrap">{lang === 'ar' ? 'تنبيه عاجل' : 'Urgent Notice'}</span></button>}\n            </div>\n            <div className="flex items-center gap-2 shrink-0">\n              {isLeader && pendingLeavesCount > 0 && <button onClick={() => setActiveTab('leaves')} className="relative h-9 w-9 flex items-center justify-center rounded-lg bg-slate-800/70 hover:bg-slate-700 text-slate-300 transition shrink-0" title={`${pendingLeavesCount} طلبات معلقة`}><Bell className="w-4 h-4 text-amber-400" /><span className="absolute -top-1 -end-1 min-w-4 h-4 px-0.5 bg-amber-500 text-slate-950 font-bold text-[10px] rounded-full flex items-center justify-center">{pendingLeavesCount}</span></button>}\n              {currentUser ? <div className="relative shrink-0">\n                <button type="button" onClick={() => setShowProfileMenu(v=>!v)} className="h-9 flex items-center justify-center gap-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700/70 px-1.5 sm:px-2 transition" aria-expanded={showProfileMenu} title={lang === 'ar' ? 'قائمة البروفايل' : 'Profile menu'}>\n                  <UserAvatar name={currentUser.nameEn || currentUser.nameAr} code={currentUser.code} avatar={currentUser.avatar} size="xs" />\n                  <ChevronDown className={`hidden sm:block w-3.5 h-3.5 text-slate-400 transition-transform ${showProfileMenu ? 'rotate-180' : ''}`} />\n                </button>\n                {showProfileMenu && <div className="absolute top-full mt-2 end-0 w-64 max-w-[calc(100vw-24px)] rounded-xl border border-slate-700/80 bg-slate-900/95 backdrop-blur-md shadow-xl overflow-hidden z-[70]">\n                  <div className="px-3 py-2.5 border-b border-slate-700/70"><p className="text-sm font-bold text-white truncate">{getFirstTwoNames(lang === 'ar' ? currentUser.nameAr : currentUser.nameEn)}</p><p className="text-[10px] font-bold text-emerald-400 mt-0.5">{currentUser.role === 'leader' ? 'TL' : (lang === 'ar' ? 'حساب موظف' : 'Employee Account')}</p></div>\n                  <button type="button" onClick={() => {setShowProfileMenu(false);setShowAvatarModal(true);}} className="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm font-bold text-slate-100 hover:bg-slate-800 transition text-start"><Camera className="w-4 h-4 text-emerald-400" /><span>{lang === 'ar' ? 'تغيير الصورة الشخصية' : 'Change profile photo'}</span></button>\n                  <div className="flex items-center justify-between gap-3 px-3.5 py-2.5 text-sm font-bold text-slate-100 hover:bg-slate-800"><div className="flex items-center gap-3 min-w-0">{isDarkMode ? <Moon className="w-4 h-4 text-sky-400" /> : <Sun className="w-4 h-4 text-amber-400" />}<span>{lang === 'ar' ? 'الوضع الداكن' : 'Dark Mode'}</span></div><button type="button" role="switch" aria-checked={isDarkMode} onClick={toggleDarkMode} className={`relative h-6 w-11 shrink-0 rounded-full transition ${isDarkMode ? 'bg-emerald-600' : 'bg-slate-600'}`}><span className={`absolute top-1 h-4 w-4 rounded-full bg-white shadow transition-all ${isDarkMode ? 'right-1' : 'left-1'}`} /></button></div>\n                  <div className="border-t border-slate-700/70" />\n                  <button type="button" onClick={() => {setShowProfileMenu(false);onLogout();}} className="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm font-bold text-rose-300 hover:bg-rose-500/10 transition text-start"><LogOut className="w-4 h-4" /><span>{lang === 'ar' ? 'تسجيل الخروج' : 'Logout'}</span></button>\n                </div>}\n              </div> : <button onClick={onOpenLoginModal} className="h-9 flex items-center justify-center gap-1.5 px-2.5 rounded-lg bg-[#0d2240] hover:bg-[#153460] text-white border border-blue-900 text-xs font-bold transition shrink-0"><LogIn className="w-3.5 h-3.5 text-emerald-400" /><span className="hidden sm:inline">{lang === 'ar' ? 'تسجيل الدخول' : 'Login'}</span></button>}\n              {currentUser && <div className="h-9 flex items-center justify-center shrink-0"><NotificationCenter notifications={notifications} currentUserId={currentUserId || currentUser.id} lang={lang} onMarkAsRead={onMarkNotificationAsRead} onMarkAllAsRead={onMarkAllNotificationsAsRead} /></div>}\n            </div>\n          </div>\n'''
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8')
      - name: Build and verify
        run: |
          npm install
          npm run build
          grep -q "showProfileMenu" src/components/Header.tsx
          grep -q "tech-source-theme" src/components/Header.tsx
          grep -q "Dark Mode" src/components/Header.tsx
          ! grep -q "User Status" src/components/Header.tsx
          echo "Responsive header verification passed"
      - name: Commit and push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: responsive header profile dropdown and dark mode"
          # Build scripts can modify generated/tracked files. Remove only those
          # post-build unstaged changes before rebasing the verified Header commit.
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
