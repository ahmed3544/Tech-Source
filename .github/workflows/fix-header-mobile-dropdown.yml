name: Fix Responsive Header and Profile Dropdown

on:
  push:
    branches: [main]

jobs:
  fix-header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Header.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace('  Camera,\n  Megaphone,', '  Camera,\n  Megaphone,\n  Moon,\n  Sun,\n  ChevronDown,')
          s = s.replace("  const [showAvatarModal, setShowAvatarModal] = useState(false);", "  const [showAvatarModal, setShowAvatarModal] = useState(false);\n  const [showProfileMenu, setShowProfileMenu] = useState(false);\n  const [isDarkMode, setIsDarkMode] = useState(true);\n\n  useEffect(() => {\n    const savedTheme = localStorage.getItem('tech-source-theme');\n    const dark = savedTheme !== 'light';\n    setIsDarkMode(dark);\n    document.documentElement.classList.toggle('dark', dark);\n  }, []);\n\n  const toggleDarkMode = () => {\n    setIsDarkMode(prev => {\n      const next = !prev;\n      localStorage.setItem('tech-source-theme', next ? 'dark' : 'light');\n      document.documentElement.classList.toggle('dark', next);\n      return next;\n    });\n  };")

          old = '''      <div className="max-w-7xl mx-auto px-4 sm:px-6 min-h-[72px] py-2 flex items-center justify-between gap-4">'''
          new = '''      <div className="w-full max-w-full mx-auto px-3 sm:px-6 min-h-[60px] sm:min-h-[72px] py-2 flex items-center justify-between gap-2 sm:gap-4 overflow-visible">'''
          s = s.replace(old, new, 1)
          s = s.replace('        <div className="flex items-center gap-3">', '        <div className="flex items-center gap-2 min-w-0 shrink-0">', 1)
          s = s.replace('          <TechSourceLogo size="md" showSubtitle={true} />', '          <div className="max-w-full overflow-hidden"><TechSourceLogo size="md" showSubtitle={true} /></div>', 1)

          old_start = '''          {/* Language Switcher */}'''
          old_end = '''          {/* Notifications */}'''
          a = s.index(old_start)
          b = s.index(old_end, a)
          replacement = '''          {/* Compact Header Actions */}\n          <div className="flex items-center justify-end gap-2 shrink-0 min-w-0">\n\n            {/* Language */}\n            <button\n              onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')}\n              className="h-9 min-w-9 sm:min-w-10 flex items-center justify-center gap-1.5 px-2 sm:px-3 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-100 border border-slate-700/70 text-xs font-bold transition shrink-0"\n              title={lang === 'ar' ? 'Switch to English' : 'التحويل للغة العربية'}\n            >\n              <Globe className="w-4 h-4 text-sky-400 shrink-0" />\n              <span className="hidden sm:inline font-sans text-[11px] font-extrabold uppercase tracking-wide whitespace-nowrap">\n                {lang === 'ar' ? 'English' : 'عربي'}\n              </span>\n            </button>\n\n            {/* Company Rules */}\n            <button\n              onClick={onOpenRulesModal}\n              className="hidden sm:flex h-9 items-center justify-center gap-1.5 px-2.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold transition shrink-0"\n              title={lang === 'ar' ? 'عرض لائحة العمل والجزاءات المعتمدة' : 'Company Work Regulations'}\n            >\n              <Scale className="w-3.5 h-3.5 text-amber-400 shrink-0" />\n              <span className="whitespace-nowrap">{lang === 'ar' ? 'لائحة الشركة' : 'Company Rules'}</span>\n            </button>\n\n            {/* Urgent Announcement */}\n            {isLeader && onOpenNoticeModal && (\n              <button\n                onClick={onOpenNoticeModal}\n                className="hidden md:flex h-9 items-center justify-center gap-1.5 px-2.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 text-xs font-bold transition shrink-0"\n                title={lang === 'ar' ? 'نشر وإدارة التنبيهات والأوامر العاجلة' : 'Manage Urgent Notices'}\n              >\n                <Megaphone className="w-3.5 h-3.5 text-rose-400 shrink-0" />\n                <span className="whitespace-nowrap">{lang === 'ar' ? 'تنبيه عاجل' : 'Urgent Notice'}</span>\n              </button>\n            )}\n\n            {/* Live Digital Clock */}\n            <div className="hidden lg:flex h-9 items-center gap-2 bg-slate-800/80 px-3 rounded-lg border border-slate-700/60 shrink-0">\n              <Clock className="w-4 h-4 text-emerald-400 animate-pulse" />\n              <div className="text-right">\n                <div className="text-xs font-mono font-bold text-white tracking-wider">{timeStr}</div>\n                <div className="text-[10px] text-slate-400">{dateStr}</div>\n              </div>\n            </div>\n\n            {/* User / Profile */}\n            {currentUser ? (\n              <div className="relative shrink-0">\n                <button\n                  type="button"\n                  onClick={() => setShowProfileMenu(prev => !prev)}\n                  className="h-9 flex items-center justify-center gap-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700/70 px-1.5 sm:px-2 transition"\n                  aria-expanded={showProfileMenu}\n                  title={lang === 'ar' ? 'قائمة البروفايل' : 'Profile menu'}\n                >\n                  <span className="relative group shrink-0">\n                    <UserAvatar\n                      name={currentUser.nameEn || currentUser.nameAr}\n                      code={currentUser.code}\n                      avatar={currentUser.avatar}\n                      size="xs"\n                    />\n                  </span>\n                  <ChevronDown className={`hidden sm:block w-3.5 h-3.5 text-slate-400 transition-transform ${showProfileMenu ? 'rotate-180' : ''}`} />\n                </button>\n\n                {showProfileMenu && (\n                  <div className="absolute top-full mt-2 end-0 w-64 max-w-[calc(100vw-24px)] rounded-xl border border-slate-700/80 bg-slate-900/95 backdrop-blur-md shadow-xl overflow-hidden z-[70]">\n                    <div className="px-3 py-2.5 border-b border-slate-700/70">\n                      <p className="text-sm font-bold text-white truncate">\n                        {getFirstTwoNames(lang === 'ar' ? currentUser.nameAr : currentUser.nameEn)}\n                      </p>\n                      <p className="text-[10px] font-bold text-emerald-400 mt-0.5">\n                        {currentUser.role === 'leader' ? 'TL' : (lang === 'ar' ? 'حساب موظف' : 'Employee Account')}\n                      </p>\n                    </div>\n\n                    <button\n                      type="button"\n                      onClick={() => { setShowProfileMenu(false); setShowAvatarModal(true); }}\n                      className="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm font-bold text-slate-100 hover:bg-slate-800 transition text-start"\n                    >\n                      <Camera className="w-4 h-4 text-emerald-400 shrink-0" />\n                      <span>{lang === 'ar' ? 'تغيير الصورة الشخصية' : 'Change profile photo'}</span>\n                    </button>\n\n                    <div className="flex items-center justify-between gap-3 px-3.5 py-2.5 text-sm font-bold text-slate-100 hover:bg-slate-800 transition">\n                      <div className="flex items-center gap-3 min-w-0">\n                        {isDarkMode ? <Moon className="w-4 h-4 text-sky-400 shrink-0" /> : <Sun className="w-4 h-4 text-amber-400 shrink-0" />}\n                        <span className="truncate">{lang === 'ar' ? 'الوضع الداكن' : 'Dark Mode'}</span>\n                      </div>\n                      <button\n                        type="button"\n                        role="switch"\n                        aria-checked={isDarkMode}\n                        onClick={toggleDarkMode}\n                        className={`relative h-6 w-11 shrink-0 rounded-full transition ${isDarkMode ? 'bg-emerald-600' : 'bg-slate-600'}`}\n                        title={isDarkMode ? 'Dark mode on' : 'Dark mode off'}\n                      >\n                        <span className={`absolute top-1 h-4 w-4 rounded-full bg-white shadow transition-all ${isDarkMode ? 'right-1' : 'left-1'}`} />\n                      </button>\n                    </div>\n\n                    <div className="border-t border-slate-700/70" />\n                    <button\n                      type="button"\n                      onClick={() => { setShowProfileMenu(false); onLogout(); }}\n                      className="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm font-bold text-rose-300 hover:bg-rose-500/10 transition text-start"\n                    >\n                      <LogOut className="w-4 h-4 shrink-0" />\n                      <span>{lang === 'ar' ? 'تسجيل الخروج' : 'Logout'}</span>\n                    </button>\n                  </div>\n                )}\n              </div>\n            ) : (\n              <button\n                onClick={onOpenLoginModal}\n                className="h-9 flex items-center justify-center gap-1.5 px-2.5 sm:px-3 rounded-lg bg-[#0d2240] hover:bg-[#153460] text-white border border-blue-900 text-xs font-bold transition shrink-0"\n              >\n                <LogIn className="w-3.5 h-3.5 text-emerald-400" />\n                <span className="hidden sm:inline">{lang === 'ar' ? 'تسجيل الدخول' : 'Login'}</span>\n              </button>\n            )}\n\n            {/* Pending Leaves */}\n            {isLeader && pendingLeavesCount > 0 && (\n              <button\n                onClick={() => setActiveTab('leaves')}\n                className="relative h-9 w-9 flex items-center justify-center rounded-lg bg-slate-800/70 hover:bg-slate-700 text-slate-300 transition-colors shrink-0"\n                title={`${pendingLeavesCount} طلبات معلقة`}\n              >\n                <Bell className="w-4 h-4 text-amber-400" />\n                <span className="absolute -top-1 -end-1 min-w-4 h-4 px-0.5 bg-amber-500 text-slate-950 font-bold text-[10px] rounded-full flex items-center justify-center font-mono">\n                  {pendingLeavesCount}\n                </span>\n              </button>\n            )}\n\n            {/* Notification Center */}\n            {currentUser && (\n              <div className="h-9 flex items-center justify-center shrink-0">\n                <NotificationCenter\n                  notifications={notifications}\n                  currentUserId={currentUserId || currentUser?.id}\n                  lang={lang}\n                  onMarkAsRead={onMarkNotificationAsRead}\n                  onMarkAllAsRead={onMarkAllNotificationsAsRead}\n                />\n              </div>\n            )}\n          </div>\n\n'''
          s = s[:a] + replacement + s[b:]

          # Remove old user-status/notifications block that now remains before our notifications marker.
          start_marker = '          {/* =========================\n              User Status\n          ========================== */}'
          end_marker = '          {/* Notifications */}'
          if start_marker in s:
            a = s.index(start_marker)
            b = s.index(end_marker, a)
            s = s[:a] + s[b:]
          # Remove the old Notifications + Notification Center block if duplicated after the new block.
          dup = '          {/* Notifications */}'
          if dup in s:
            a = s.index(dup)
            # Keep only through the next closing of the surrounding Right Section by removing known old block.
            nc = s.find('          {/* Notification Center */}', a)
            if nc != -1:
              end = s.find('        </div>\n      </div>', nc)
              if end != -1:
                # Preserve outer div closure, discard duplicate notification markup up to it.
                s = s[:a] + s[end:]

          # Ensure profile action group has a clean 8px gap and unified alignment.
          s = s.replace('        <div className="flex items-center gap-2 sm:gap-3">', '        <div className="flex items-center justify-between gap-2 sm:gap-3 w-full min-w-0">', 1)
          s = s.replace('      <nav dir=', '      <nav dir=', 1)

          p.write_text(s, encoding='utf-8')

      - name: Build
        run: |
          npm install
          npm run build

      - name: Verify header requirements
        run: |
          grep -q "showProfileMenu" src/components/Header.tsx
          grep -q "tech-source-theme" src/components/Header.tsx
          grep -q "justify-between gap-2 sm:gap-3 w-full" src/components/Header.tsx
          grep -q "Change profile photo" src/components/Header.tsx
          grep -q "Dark Mode" src/components/Header.tsx
          grep -q "onLogout" src/components/Header.tsx
          echo "Header verification passed"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx
          if git diff --cached --quiet; then
            echo "No Header changes to commit"
            exit 0
          fi
          git commit -m "fix: responsive header profile dropdown and dark mode"
          git pull --rebase origin main
          git push origin HEAD:main
