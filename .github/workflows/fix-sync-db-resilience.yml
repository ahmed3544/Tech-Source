name: Repair production sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sync-db-resilience.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/device-sync-v2.ts')
          s = p.read_text()
          old = "async function setting(k:string,v:any,updatedAt?:any){const a=await db.select().from(schema.settings).where(eq(schema.settings.key,k)),isCollection=k==='dailyShiftAssignments'||k==='shiftSwapRequests';if(!a[0]){await db.insert(schema.settings).values({key:k,value:v} as any);return;}"
          new = "async function setting(k:string,v:any,updatedAt?:any){const a=await db.select().from(schema.settings).where(eq(schema.settings.key,k)),isCollection=k==='dailyShiftAssignments'||k==='shiftSwapRequests';if(!a[0]){await db.insert(schema.settings).values({key:k,value:v} as any);if(isCollection){const stampKey=`__sync_updated_at:${k}`;await db.insert(schema.settings).values({key:stampKey,value:stamp(updatedAt)} as any);}return;}"
          if old in s:
              s = s.replace(old, new, 1)
          old = "const [employees,attendanceRecords,leaveRequests,overtimeRequests,shifts,settings,employeeShiftAssignments]=await Promise.all([db.select().from(schema.employees),db.select().from(schema.attendanceRecords),db.select().from(schema.leaveRequests),db.select().from(schema.overtimeRequests),db.select().from(schema.shifts),db.select().from(schema.settings),db.select().from(schema.employeeShiftAssignments)]);"
          new = "const [employees,attendanceRecords,leaveRequests,overtimeRequests,shifts,settings]=await Promise.all([db.select().from(schema.employees),db.select().from(schema.attendanceRecords),db.select().from(schema.leaveRequests),db.select().from(schema.overtimeRequests),db.select().from(schema.shifts),db.select().from(schema.settings)]);let employeeShiftAssignments:any[]=[];try{employeeShiftAssignments=await db.select().from(schema.employeeShiftAssignments);}catch(e){console.warn('[device-sync-v2] schedule table unavailable',e);}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/device-sync-v2.ts
          git commit -m 'fix: prevent schedule table from breaking central sync' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-sync-db-resilience.yml
          git add -A
          git commit -m 'chore: remove temporary sync repair workflow' || exit 0
          git push