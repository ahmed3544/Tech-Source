name: Apply leader-managed shift scheduling v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'Replace fixed shifts with leader-managed schedules')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'Missing target in {path}: {old[:120]}')
              p.write_text(s.replace(old,new,count), encoding='utf-8')

          def regex_replace(path, pattern, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              ns=re.sub(pattern,new,s,count=count)
              if ns == s: raise SystemExit(f'Missing regex target in {path}')
              p.write_text(ns,encoding='utf-8')

          regex_replace('src/mockData.ts', r'export const INITIAL_SHIFTS: Shift\[\] = \[[\s\S]*?\n\];\n\nexport const INITIAL_DEPARTMENTS', 'export const INITIAL_SHIFTS: Shift[] = [];\n\nexport const INITIAL_DEPARTMENTS')

          regex_replace('src/App.tsx', r'  const \[shifts\][\s\S]*?\n\n  const \[dailyShiftAssignments', "  const [shifts, setShifts] = useState<Shift[]>(() => {\n    try {\n      const saved = localStorage.getItem('attendance_shifts');\n      return saved ? JSON.parse(saved) : [];\n    } catch { return []; }\n  });\n\n  const [dailyShiftAssignments", 1)
          must_replace('src/App.tsx', "    dailyShiftAssignments?: DailyShiftAssignment[];\n    deletedAttendanceIds?: string[];", "    dailyShiftAssignments?: DailyShiftAssignment[];\n    shifts?: Shift[];\n    deletedAttendanceIds?: string[];")
          must_replace('src/App.tsx', "  if (overrides?.dailyShiftAssignments !== undefined) {\n    payload.dailyShiftAssignments = overrides.dailyShiftAssignments;\n  }", "  if (overrides?.dailyShiftAssignments !== undefined) {\n    payload.dailyShiftAssignments = overrides.dailyShiftAssignments;\n  }\n  if (overrides?.shifts !== undefined) {\n    payload.shifts = overrides.shifts;\n  }")
          must_replace('src/App.tsx', "          if (Array.isArray(data.dailyShiftAssignments)) {\n            setDailyShiftAssignments(data.dailyShiftAssignments);\n            localStorage.setItem('daily_shift_assignments', JSON.stringify(data.dailyShiftAssignments));\n          }", "          if (Array.isArray(data.dailyShiftAssignments)) {\n            setDailyShiftAssignments(data.dailyShiftAssignments);\n            localStorage.setItem('daily_shift_assignments', JSON.stringify(data.dailyShiftAssignments));\n          }\n          if (Array.isArray(data.shifts)) {\n            setShifts(data.shifts);\n            localStorage.setItem('attendance_shifts', JSON.stringify(data.shifts));\n          }")

          must_replace('src/components/WeeklyShiftSchedule.tsx', "import { INITIAL_SHIFTS } from '../mockData';\n", '')
          must_replace('src/components/WeeklyShiftSchedule.tsx', "  const [shifts, setShifts] = useState<Shift[]>(suppliedShifts?.length ? suppliedShifts : INITIAL_SHIFTS);", "  const [shifts, setShifts] = useState<Shift[]>(suppliedShifts || []);")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "  const visibleEmployees = useMemo(() => isLeader ? employees : employees.filter(e => e.id === currentUser?.id), [employees, isLeader, currentUser]);", "  const visibleEmployees = useMemo(() => {\n    if (!isLeader) return employees.filter(e => e.id === currentUser?.id);\n    if (currentUser?.role === 'admin') return employees;\n    const explicitTeam = employees.some(e => e.teamLeaderId === currentUser?.id);\n    if (explicitTeam) return employees.filter(e => e.teamLeaderId === currentUser?.id);\n    if (currentUser?.teamId) {\n      const sameTeam = employees.filter(e => e.teamId === currentUser.teamId);\n      if (sameTeam.length) return sameTeam;\n    }\n    return employees;\n  }, [employees, isLeader, currentUser]);")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "{lang === 'ar' ? 'جدول الشفت الأسبوعي' : 'Weekly Shift Schedule'}", "{lang === 'ar' ? 'الجدول الأسبوعي' : 'Weekly Schedule'}")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "{lang === 'ar' ? 'هذا الأسبوع' : 'This week'}", "{lang === 'ar' ? 'الأسبوع الحالي' : 'Current Week'}")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "{lang === 'ar' ? 'بدون شفت' : 'No shift'}", "{lang === 'ar' ? 'غير محدد' : 'Not assigned'}")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "{lang === 'ar' ? 'حفظ جدول الأسبوع' : 'Save Week'}", "{lang === 'ar' ? 'حفظ الجدول' : 'Save Schedule'}")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "{isLeader ? (lang === 'ar' ? 'اختار الشفت لكل يوم، ثم احفظ الأسبوع بالكامل. وقت الشفت والبريكات المحددة داخل الشفت تظهر للموظف.' : 'Choose each daily shift and save the week. Shift time and configured breaks are shown to the employee.') : (lang === 'ar' ? 'هذا جدولك الأسبوعي، ويظهر لك وقت كل شفت والبريكات المحددة له.' : 'This is your weekly schedule, including shift times and configured breaks.')}", "{isLeader ? (lang === 'ar' ? 'حدد الوردية لكل يوم ثم احفظ الجدول.' : 'Assign a shift for each day and save.') : (lang === 'ar' ? 'الجدول الأسبوعي ومواعيد الورديات والاستراحات.' : 'Weekly schedule, shift times, and breaks.')}")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "  const [error, setError] = useState<string | null>(null);", "  const [error, setError] = useState<string | null>(null);\n  const [showShiftManager, setShowShiftManager] = useState(false);")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "import { Employee, Language, Shift, DailyShiftAssignment } from '../types';", "import { Employee, Language, Shift, DailyShiftAssignment } from '../types';\nimport { ShiftManager } from './ShiftManager';")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "  return (\n    <div className=\"fixed inset-0", "  const updateShiftList = (next: Shift[]) => {\n    setShifts(next);\n    try { localStorage.setItem('attendance_shifts', JSON.stringify(next)); } catch {}\n    void fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ shifts: next }) });\n  };\n\n  return (\n    <div className=\"fixed inset-0")
          must_replace('src/components/WeeklyShiftSchedule.tsx', "            <div className=\"flex items-center gap-2\">", "            <div className=\"flex items-center gap-2\">\n              {isLeader && <button type=\"button\" onClick={() => setShowShiftManager(true)} className=\"px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 border border-emerald-500 text-xs font-bold\">{lang === 'ar' ? 'إدارة الورديات' : 'Manage Shifts'}</button>}", 1)
          must_replace('src/components/WeeklyShiftSchedule.tsx', "        </div>\n      </section>\n    </div>\n  );\n};", "        </div>\n      </section>\n      {showShiftManager && isLeader && (\n        <div className=\"fixed inset-0 z-[120] bg-slate-950/60 backdrop-blur-sm p-4 overflow-y-auto\">\n          <div className=\"max-w-4xl mx-auto mt-8 bg-white rounded-3xl shadow-2xl p-5\">\n            <div className=\"flex justify-between items-center mb-4\">\n              <h3 className=\"text-lg font-black text-slate-900\">{lang === 'ar' ? 'إدارة الورديات' : 'Shift Management'}</h3>\n              <button type=\"button\" onClick={() => setShowShiftManager(false)} className=\"px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold\">{lang === 'ar' ? 'إغلاق' : 'Close'}</button>\n            </div>\n            <ShiftManager\n              shifts={shifts}\n              lang={lang}\n              onAddShift={shift => updateShiftList([...shifts, shift])}\n              onUpdateShift={shift => updateShiftList(shifts.map(item => item.id === shift.id ? shift : item))}\n              onDeleteShift={shiftId => updateShiftList(shifts.filter(item => item.id !== shiftId))}\n            />\n          </div>\n        </div>\n      )}\n    </div>\n  );\n};")

          must_replace('server.ts', "    if (s.key === \"dailyShiftAssignments\") {\n      localState.dailyShiftAssignments = Array.isArray(s.value) ? s.value : [];\n    }", "    if (s.key === \"dailyShiftAssignments\") {\n      localState.dailyShiftAssignments = Array.isArray(s.value) ? s.value : [];\n    }\n    if (s.key === \"shiftTemplates\" && Array.isArray(s.value)) {\n      localState.shifts = s.value;\n    }")
          must_replace('server.ts', "        if (Array.isArray(b.dailyShiftAssignments)) {\n          await setting(\"dailyShiftAssignments\", b.dailyShiftAssignments);\n        }", "        if (Array.isArray(b.dailyShiftAssignments)) {\n          await setting(\"dailyShiftAssignments\", b.dailyShiftAssignments);\n        }\n        if (Array.isArray(b.shifts)) {\n          await setting(\"shiftTemplates\", b.shifts);\n        }")
          PY
      - name: TypeScript check
        run: |
          npm ci
          npm run lint
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/custom-team-shifts.yml .github/workflows/custom-team-shifts-v2.yml .github/workflows/custom-team-shifts-v3.yml
          git add src/App.tsx src/components/WeeklyShiftSchedule.tsx src/mockData.ts server.ts
          git diff --cached --quiet || git commit -m "Replace fixed shifts with leader-managed schedules"
          git push
