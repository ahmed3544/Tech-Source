name: Apply UI cleanup and localization

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_ui_i18n.cjs'
      - '.github/workflows/apply-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply UI patch
        run: node scripts/patch_ui_i18n.cjs

      - name: Commit UI changes
        run: |
          if git diff --quiet; then
            echo "No UI changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EmployeePortal.tsx src/components/KioskPunch.tsx src/components/DashboardOverview.tsx src/components/AttendanceLogTable.tsx src/utils/helpers.ts
          git commit -m "fix: clean UI emojis and localize attendance labels"
          git push
