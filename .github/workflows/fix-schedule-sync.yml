name: Fix schedule sync freshness
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server sync timestamps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/device-sync-v2.ts')
          s = p.read_text()
          old = "if(isCollection){await db.update(schema.settings).set({value:mergeCollection(a[0].value,v)} as any).where(eq(schema.settings.key,k));return;}"
          new = "if(isCollection){await db.update(schema.settings).set({value:mergeCollection(a[0].value,v)} as any).where(eq(schema.settings.key,k));const next=stamp(updatedAt);const t=await db.select().from(schema.settings).where(eq(schema.settings.key,stampKey));if(!t[0])await db.insert(schema.settings).values({key:stampKey,value:next} as any);else await db.update(schema.settings).set({value:next} as any).where(eq(schema.settings.key,stampKey));return;}"
          if old not in s:
              raise SystemExit('collection setting block not found')
          s = s.replace(old, new, 1)
          old2 = "const all=[...employees,...attendanceRecords,...leaveRequests,...overtimeRequests,...shifts,...employeeShiftAssignments];const lastUpdated=Math.max(0,...all.map((x:any)=>ms(x?.updatedAt||x?.createdAt)));"
          new2 = "const all=[...employees,...attendanceRecords,...leaveRequests,...overtimeRequests,...shifts,...employeeShiftAssignments];const syncSettingTimes=settings.filter((s:any)=>String(s.key).startsWith('__sync_updated_at:')).map((s:any)=>ms(s.value));const lastUpdated=Math.max(0,...all.map((x:any)=>ms(x?.updatedAt||x?.createdAt)),...syncSettingTimes);"
          if old2 not in s:
              raise SystemExit('snapshot lastUpdated block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/device-sync-v2.ts
          git commit -m 'fix: expose schedule sync updates to other devices'
          git rm .github/workflows/fix-schedule-sync.yml
          git commit -m 'chore: remove temporary schedule sync workflow'
          git push
