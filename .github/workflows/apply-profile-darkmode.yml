name: Apply Profile and Dark Mode UI

on:
  push:
    branches: [main]

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply UI changes
        shell: python
        run: |
          from pathlib import Path
          portal = Path('src/components/EmployeePortal.tsx')
          s = portal.read_text(encoding='utf-8')
          old_overlay = '''            <div className="absolute inset-0 rounded-full bg-slate-950/60 backdrop-blur-xs flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-white text-[10px] font-bold">\n              <Camera className="w-5 h-5 text-emerald-400 mb-0.5" />\n              <span>{lang === 'ar' ? 'تغيير' : 'Edit'}</span>\n            </div>\n'''
          if old_overlay in s:
              s = s.replace(old_overlay, '', 1)
          old_button = '''            <button\n              onClick={() => setShowAvatarModal(true)}\n              className="mt-1.5 text-[11px] text-emerald-400 hover:text-emerald-300 flex items-center gap-1 font-bold underline decoration-dotted"\n            >\n              <Camera className="w-3.5 h-3.5 text-emerald-400" />\n              <span>{lang === 'ar' ? 'تغيير الصورة الشخصية' : 'Change Profile Photo'}</span>\n            </button>\n'''
          if old_button in s:
              s = s.replace(old_button, '', 1)
          s = s.replace('                #{emp.code}', '                HR ID: {emp.code}', 1)
          portal.write_text(s, encoding='utf-8')

          header = Path('src/components/Header.tsx')
          h = header.read_text(encoding='utf-8')
          if '  Moon,\n  Sun,' not in h:
              h = h.replace('  Camera,\n  Megaphone,', '  Camera,\n  Moon,\n  Sun,\n  Megaphone,', 1)
          state_marker = '''  const [now, setNow] = useState<Date>(new Date());\n  const [showAvatarModal, setShowAvatarModal] = useState(false);'''
          state_replacement = '''  const [now, setNow] = useState<Date>(new Date());\n  const [showAvatarModal, setShowAvatarModal] = useState(false);\n  const [isDarkMode, setIsDarkMode] = useState<boolean>(() => {\n    if (typeof window === 'undefined') return false;\n    return localStorage.getItem('tech-source-theme') === 'dark';\n  });'''
          if state_marker in h and 'const [isDarkMode, setIsDarkMode]' not in h:
              h = h.replace(state_marker, state_replacement, 1)
          effect_marker = '''  useEffect(() => {\n    const timer = setInterval(() => {\n      setNow(new Date());\n    }, 1000);\n\n    return () => clearInterval(timer);\n  }, []);'''
          effect_replacement = effect_marker + '''\n\n  useEffect(() => {\n    document.documentElement.classList.toggle('dark', isDarkMode);\n    localStorage.setItem('tech-source-theme', isDarkMode ? 'dark' : 'light');\n  }, [isDarkMode]);'''
          if 'document.documentElement.classList.toggle' not in h and effect_marker in h:
              h = h.replace(effect_marker, effect_replacement, 1)
          lang_button_end = '''          </button>\n\n          {/* Company Rules */}'''
          dark_button = '''          </button>\n\n          {/* Dark / Light Mode */}\n          <button type="button" onClick={() => setIsDarkMode(prev => !prev)} aria-pressed={isDarkMode} title={isDarkMode ? (lang === 'ar' ? 'التبديل إلى الوضع الفاتح' : 'Switch to light mode') : (lang === 'ar' ? 'التبديل إلى الوضع الداكن' : 'Switch to dark mode')} className="relative inline-flex h-8 w-14 items-center rounded-full border border-slate-700 bg-slate-800 p-1 transition-all duration-300 hover:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50">\n            <span className={`absolute top-1 h-6 w-6 rounded-full bg-white shadow-md transition-transform duration-300 ${isDarkMode ? 'translate-x-6' : 'translate-x-0'}`} />\n            <Sun className={`z-10 h-3.5 w-3.5 transition-opacity ${isDarkMode ? 'opacity-40 text-slate-300' : 'opacity-100 text-amber-500'}`} />\n            <Moon className={`z-10 ml-auto h-3.5 w-3.5 transition-opacity ${isDarkMode ? 'opacity-100 text-indigo-600' : 'opacity-40 text-slate-400'}`} />\n          </button>\n\n          {/* Company Rules */}'''
          if '/* Dark / Light Mode */' not in h and lang_button_end in h:
              h = h.replace(lang_button_end, dark_button, 1)
          header.write_text(h, encoding='utf-8')

          css = Path('src/index.css')
          c = css.read_text(encoding='utf-8')
          if '/* Global Dark Mode */' not in c:
              c += '''\n\n/* Global Dark Mode */\nhtml.dark { color-scheme: dark; --tech-source-surface: #0b1220; }\nhtml.dark body { background: var(--tech-source-surface); color: #e2e8f0; }\nhtml.dark #root .bg-white { background-color: #111827 !important; }\nhtml.dark #root .bg-slate-50 { background-color: #172033 !important; }\nhtml.dark #root .bg-slate-100 { background-color: #1e293b !important; }\nhtml.dark #root .border-slate-200, html.dark #root .border-slate-100 { border-color: #334155 !important; }\nhtml.dark #root .text-slate-900 { color: #f1f5f9 !important; }\nhtml.dark #root .text-slate-800 { color: #e2e8f0 !important; }\nhtml.dark #root .text-slate-700, html.dark #root .text-slate-600 { color: #cbd5e1 !important; }\nhtml.dark #root .text-slate-500 { color: #94a3b8 !important; }\nhtml.dark #root input, html.dark #root select, html.dark #root textarea { background-color: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important; }\nhtml.dark #root input::placeholder, html.dark #root textarea::placeholder { color: #64748b !important; }\nhtml.dark #root .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }\n'''
          css.write_text(c, encoding='utf-8')
      - name: Install dependencies
        run: npm install
      - name: Full production build verification
        run: npm run build
      - name: Verify source changes
        run: |
          grep -q "HR ID: {emp.code}" src/components/EmployeePortal.tsx
          ! grep -q "تغيير الصورة الشخصية" src/components/EmployeePortal.tsx
          grep -q "isDarkMode" src/components/Header.tsx
          grep -q "html.dark" src/index.css
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EmployeePortal.tsx src/components/Header.tsx src/index.css
          if git diff --cached --quiet; then
            echo "No UI changes to commit."
          else
            git commit -m "feat: update employee profile and add dark mode"
            git restore .
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then exit 0; fi
              fi
              git rebase --abort || true
              sleep 3
            done
            exit 1
          fi
