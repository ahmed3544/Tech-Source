name: Fix production API and employee crash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix production API and employee crash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch server API and employee shift guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Prevent a bad/missing shift record from crashing the Employees screen.
          p = Path('src/components/EmployeeManager.tsx')
          s = p.read_text(encoding='utf-8')
          old = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0];"
          new = "const shift = shifts.find(s => s.id === emp.shiftId) || shifts[0] || { startTime: '09:00', endTime: '17:00' };"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # Do not let one broken/missing Supabase table take /api/data down with 500.
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          marker = "async function data() {"
          start = s.index(marker)
          query_start = s.index("  const [\n    employees,", start)
          query_end = s.index("\n\n  /*\n  IMPORTANT:", query_start)
          replacement = '''  const safeSelect = async (name: string, query: Promise<any[]>) => {
    try {
      return await query;
    } catch (error) {
      console.error(`DATA QUERY FAILED [${name}]:`, error);
      return [];
    }
  };

  const [
    employees,
    attendanceRecords,
    leaveRequests,
    overtimeRequests,
    shifts,
    notifications,
    settings,
  ] = await Promise.all([
    safeSelect("employees", db.select().from(schema.employees)),
    safeSelect("attendanceRecords", db.select().from(schema.attendanceRecords)),
    safeSelect("leaveRequests", db.select().from(schema.leaveRequests)),
    safeSelect("overtimeRequests", db.select().from(schema.overtimeRequests)),
    safeSelect("shifts", db.select().from(schema.shifts)),
    safeSelect("notifications", db.select().from(schema.notifications)),
    safeSelect("settings", db.select().from(schema.settings)),
  ]);'''
          s = s[:query_start] + replacement + s[query_end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/EmployeeManager.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix production API and employee crash"
          git push origin main
