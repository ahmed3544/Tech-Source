name: Setup Firebase Cloud Messaging
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FCM packages
        run: npm install firebase firebase-admin @capacitor/push-notifications
      - name: Add FCM integration
        shell: bash
        run: |
          python3 - <<'PY'
