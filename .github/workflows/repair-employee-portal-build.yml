name: Repair EmployeePortal build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[employee-portal-repair]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good EmployeePortal and apply badge fix
        shell: bash
        run: |
          git show 7402c391f9fb380aa006c8987c08928eccd11424:src/components/EmployeePortal.tsx > src/components/EmployeePortal.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/EmployeePortal.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''<span className="bg-amber-400 text-slate-950 text-[11px] font-black px-2.5 py-0.5 rounded-full font-mono shadow-sm">'''
          new = '''<span className="bg-amber-400 text-slate-950 text-[11px] font-black px-2.5 py-0.5 rounded-full font-mono shadow-sm inline-flex items-center whitespace-nowrap shrink-0 leading-none">'''
          if old not in s:
              raise SystemExit('Expected holiday badge markup was not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify TypeScript build
        run: |
          npm install
          npm run build

      - name: Commit repaired file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EmployeePortal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair EmployeePortal JSX build [employee-portal-repair]"
          git push