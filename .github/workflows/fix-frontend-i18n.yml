name: Fix Frontend i18n Labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-frontend-i18n.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Apply frontend i18n fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          i18n = Path('src/i18n.ts')
          i18n.parent.mkdir(parents=True, exist_ok=True)
          i18n.write_text("""import { Language } from './types';

export const uiText = {
  ar: {
    department: 'قسم',
    approved: 'معتمدة',
    hours: 'س',
    hoursLong: 'ساعة',
    hoursPerDay: 'س/يوم',
    minutes: 'دقيقة',
  },
  en: {
    department: 'Department',
    approved: 'Approved',
    hours: 'h',
    hoursLong: 'hrs',
    hoursPerDay: 'h/day',
    minutes: 'min',
  },
} as const;

export type UiTextKey = keyof typeof uiText.ar;
export const t = (lang: Language, key: UiTextKey): string => uiText[lang][key];
""", encoding='utf-8')

          p = Path('src/components/EmployeePortal.tsx')
          s = p.read_text(encoding='utf-8')
          if "from '../i18n'" not in s:
              marker = "import { BreakTimer } from './BreakTimer';"
              s = s.replace(marker, marker + "\nimport { t } from '../i18n';")
          s = s.replace("  Sparkles,\n", "")
          s = s.replace("قسم {emp.department}", "{t(lang, 'department')} {emp.department}")
          s = s.replace("قسم {e.department}", "{t(lang, 'department')} {e.department}")
          s = s.replace("{lang === 'ar' ? 'ساعة' : 'Hours'}", "{t(lang, 'hoursLong')}")
          s = s.replace("{lang === 'ar' ? 'س/يوم' : 'h/day'}", "{t(lang, 'hoursPerDay')}")
          s = s.replace("+{effectiveLateMins} دقيقة", "+{effectiveLateMins} {t(lang, 'minutes')}")
          s = s.replace("<Sparkles className=\"w-4 h-4\" />\n            <span>{lang === 'ar' ? 'العودة من الاستراحة ✨' : 'End Break ✨'}</span>", "<span>{lang === 'ar' ? 'العودة من الاستراحة' : 'End Break'}</span>")
          s = s.replace("<span>{getLeaveTypeLabel(empLeaveToday.type, lang)} (معتمدة )</span>", "<span>{getLeaveTypeLabel(empLeaveToday.type, lang)} ({t(lang, 'approved')})</span>")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n.ts src/components/EmployeePortal.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: localize employee portal labels"
          git push

      - name: Remove one-time workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main || true
          git rm -f .github/workflows/fix-frontend-i18n.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time frontend fix workflow"
          git push
