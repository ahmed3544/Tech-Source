services:
  - type: web
    name: tech-source
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVER_TIME_ZONE
        value: Africa/Cairo
      - key: SUPABASE_DB_URL
        sync: false
