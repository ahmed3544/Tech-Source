<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tech Source Attendance" />
    <title>TECH SOURCE - GDS | نظام الحضور والانصراف</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="shortcut icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      #app-loading { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); box-sizing: border-box; background: radial-gradient(circle at 50% 35%, #172554 0%, #0f172a 42%, #020617 100%); color: #f8fafc; font-family: Cairo, system-ui, sans-serif; transition: opacity 220ms ease, visibility 220ms ease; }
      #app-loading.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .app-loading-card { width: min(92vw, 420px); display: flex; flex-direction: column; align-items: center; text-align: center; }
      .app-loading-logo { width: clamp(84px, 24vw, 118px); height: clamp(84px, 24vw, 118px); object-fit: contain; margin-bottom: 22px; filter: brightness(0) invert(1) drop-shadow(0 14px 30px rgba(0, 0, 0, .28)); }
      .app-loading-company-ar { margin: 0; font-size: clamp(20px, 5.5vw, 28px); line-height: 1.35; font-weight: 800; letter-spacing: -.02em; }
      .app-loading-company-en { margin: 5px 0 0; color: #cbd5e1; font-size: clamp(12px, 3.4vw, 15px); font-weight: 600; letter-spacing: .08em; direction: ltr; }
      .app-loading-status { margin: 26px 0 14px; color: #cbd5e1; font-size: 13px; font-weight: 600; }
      .app-loading-spinner { width: 32px; height: 32px; border: 3px solid rgba(148, 163, 184, .25); border-top-color: #f8fafc; border-radius: 50%; animation: app-loading-spin .8s linear infinite; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-loading { transition: none; } .app-loading-spinner { animation-duration: 1.5s; } }
    </style>
  </head>
  <body class="bg-white text-slate-900 font-sans antialiased">
    <div id="app-loading" aria-live="polite" aria-label="جاري تحميل بيانات الشركة">
      <div class="app-loading-card">
        <img class="app-loading-logo" src="/logo.png" alt="Tech Source GDS" />
        <h1 class="app-loading-company-ar">شركة TECH SOURCE GDS</h1>
        <p class="app-loading-company-en">TECH SOURCE - GDS GLOBAL</p>
        <p id="app-loading-status" class="app-loading-status">جاري تحميل بيانات الشركة...</p>
        <div class="app-loading-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const loader = document.getElementById('app-loading'); const status = document.getElementById('app-loading-status'); const startedAt = Date.now(); const MIN_VISIBLE_MS = 700; const MAX_WAIT_MS = 10000;
        const hideLoader = () => { const remaining = Math.max(0, MIN_VISIBLE_MS - (Date.now() - startedAt)); window.setTimeout(() => loader?.classList.add('is-hidden'), remaining); };
        const loadInitialData = async () => { try { status.textContent = 'جاري الاتصال بالخادم وتجهيز البيانات...'; const controller = new AbortController(); const timeout = window.setTimeout(() => controller.abort(), MAX_WAIT_MS); const response = await fetch(`/api/data?_=${Date.now()}`, { method: 'GET', headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }, cache: 'no-store', signal: controller.signal }); window.clearTimeout(timeout); if (!response.ok) throw new Error(`Initial data request failed: ${response.status}`); const data = await response.json(); if (!data?.success) throw new Error('Initial data response was not successful'); status.textContent = 'تم تحميل البيانات. جاري فتح النظام...'; } catch { status.textContent = 'جاري فتح النظام...'; } finally { hideLoader(); } };
        loadInitialData();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script> if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); } </script>
  </body>
</html>
